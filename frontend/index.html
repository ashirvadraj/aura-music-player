<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Aura Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--surface:#212121;--border:#383838;
  --text:#f1f1f1;--muted:#aaa;--accent:#ff0000;
  --ytmusic-accent:#ff0033;
  --spotify-accent:#1db954;
  --applemusic-accent:#fa243c;
  --pill-bg:rgba(255,255,255,.1);
  --safe-top: max(32px, env(safe-area-inset-top));
}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);user-select:none;}

/* ANDROID WEBVIEW INPUT TYPING FIX */
input, textarea, [contenteditable="true"] {
  user-select: text !important;
  -webkit-user-select: text !important;
}

.app{height:100%;width:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);}

/* ── TOP HEADER ── */
.yt-header{
  height:calc(52px + var(--safe-top));
  padding-top:var(--safe-top);
  padding-left:1rem;padding-right:1rem;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;z-index:10;
}
.yt-logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;letter-spacing:-.5px;cursor:pointer;}
.yt-logo-icon{width:30px;height:22px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
.yt-logo-icon::after{content:'';border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent #fff;margin-left:2px;}
.yt-logo.ytmusic .yt-logo-icon{background:var(--ytmusic-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.ytmusic .yt-logo-icon::after{border-width:4px 0 4px 7px;}
.yt-logo.spotify .yt-logo-icon{background:var(--spotify-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.spotify .yt-logo-icon::after{content:'💚';border:none;font-size:.8rem;margin:0;}
.yt-logo.applemusic .yt-logo-icon{background:var(--applemusic-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.applemusic .yt-logo-icon::after{content:'🍎';border:none;font-size:.8rem;margin:0;}

.yt-hdr-actions{display:flex;align-items:center;gap:1.2rem;}
.yt-hdr-icon{font-size:1.2rem;cursor:pointer;color:var(--text);background:none;border:none;}

/* ── SEARCH BAR ── */
.yt-search-bar{
  padding:.6rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;gap:.5rem;align-items:center;flex-shrink:0;z-index:20;
}
.yt-input-box{
  flex:1;background:#121212;border:1px solid #303030;border-radius:20px;
  padding:.4rem .8rem;display:flex;align-items:center;gap:.6rem;position:relative;
}
.yt-input-box input{
  flex:1;background:none;border:none;outline:none;color:#fff;font-size:.95rem;
  user-select:text !important;-webkit-user-select:text !important;
}
.yt-clear-btn{
  background:none;border:none;color:var(--muted);font-size:1.2rem;
  cursor:pointer;display:none;padding:.2rem .6rem;z-index:50;
  touch-action:manipulation;-webkit-user-select:none;
}
.yt-clear-btn:active{color:#fff;transform:scale(1.2);}
.yt-search-btn{background:#222;border:1px solid #303030;border-radius:20px;color:#fff;padding:.45rem 1rem;font-weight:500;cursor:pointer;flex-shrink:0;}

/* ── MUSIC GENRE CHIPS BAR ── */
.ytm-genre-bar{
  display:none;gap:.5rem;overflow-x:auto;padding:.6rem 1rem;background:#141414;
  border-bottom:1px solid rgba(255,255,255,.05);scrollbar-width:none;flex-shrink:0;
}
.ytm-genre-chip{
  background:var(--pill-bg);border:1px solid rgba(255,255,255,.1);border-radius:16px;
  color:#fff;padding:.35rem .8rem;font-size:.78rem;font-weight:500;white-space:nowrap;cursor:pointer;
}
.ytm-genre-chip:active{background:var(--accent);}

/* ── FEED / SCROLL ── */
.yt-feed{flex:1;overflow-y:auto;padding-bottom:120px;}

/* ── CARD LAYOUTS ── */
.yt-card{margin-bottom:1.2rem;cursor:pointer;}
.yt-thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#1e1e1e;}
.yt-thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.yt-dur{
  position:absolute;bottom:8px;right:8px;
  background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:500;
  padding:2px 5px;border-radius:4px;
}
.ytm-badge{
  position:absolute;top:8px;left:8px;
  background:var(--ytmusic-accent);color:#fff;font-size:.7rem;font-weight:700;
  padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;
}
.spotify-badge{
  position:absolute;top:8px;left:8px;
  background:var(--spotify-accent);color:#000;font-size:.7rem;font-weight:700;
  padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;
}
.applemusic-badge{
  position:absolute;top:8px;left:8px;
  background:var(--applemusic-accent);color:#fff;font-size:.7rem;font-weight:700;
  padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;
}

.yt-details{display:flex;gap:.8rem;padding:.8rem 1rem 0;}
.yt-avatar{width:36px;height:36px;border-radius:50%;background:#333;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
.yt-meta{flex:1;min-width:0;}
.yt-title{font-size:.92rem;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.yt-subtext{font-size:.78rem;color:var(--muted);margin-top:4px;}

/* ── FLOATING MINI MUSIC PLAYER BAR ── */
.mini-player-bar{
  position:fixed;bottom:56px;left:0;right:0;height:52px;
  background:#1c1c1e;border-top:1px solid rgba(255,255,255,.12);
  display:none;align-items:center;justify-content:space-between;padding:0 .8rem;
  z-index:900;cursor:pointer;backdrop-filter:blur(10px);
}
.mini-player-info{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;}
.mini-player-img{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0;}
.mini-player-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-player-artist{font-size:.72rem;color:var(--spotify-accent);}
.mini-player-controls{display:flex;align-items:center;gap:.6rem;}
.mini-btn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:2px 6px;}

/* ── BOTTOM NAV BAR (HOME, YT MUSIC, SPOTIFY, APPLE MUSIC) ── */
.yt-nav{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:#0f0f0f;border-top:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:space-around;z-index:999;
}
.yt-nav-item{
  flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:.7rem;color:var(--muted);cursor:pointer;pointer-events:auto;
}
.yt-nav-item.active{color:#fff;font-weight:700;}
.yt-nav-icon{font-size:1.3rem;}

body.is-landscape .yt-nav, body.is-landscape .mini-player-bar { display: none !important; }

/* ── GUARANTEED WORKING UNIFIED PLAYER SCREEN ── */
.yt-watch-screen{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:none;flex-direction:column;width:100%;height:100%;overflow-y:auto;
}
.yt-watch-screen.is-fullscreen .yt-watch-topbar,
.yt-watch-screen.is-fullscreen .yt-watch-info,
.yt-watch-screen.is-fullscreen .yt-nav { display:none!important; }

.yt-watch-topbar{
  height:calc(48px + var(--safe-top));
  padding-top:var(--safe-top);
  padding-left:1rem;padding-right:1rem;
  display:flex;align-items:center;justify-content:space-between;
  background:#121212;border-bottom:1px solid var(--border);flex-shrink:0;
}
.yt-back-btn{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:.2rem .5rem;}

.yt-player-box{width:100%;aspect-ratio:16/9;background:#000;position:relative;z-index:10;overflow:hidden;}
.yt-watch-screen.is-fullscreen .yt-player-box{
  position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
  z-index:99999!important;aspect-ratio:unset!important;margin:0!important;padding:0!important;
}
#ytPlayerContainer{width:100%;height:100%;border:none;}

/* SPOTIFY / APPLE MUSIC ALBUM ART OVERLAY OVER PLAYER BOX */
.music-album-overlay{
  position:absolute;inset:0;background:#0b0b0b;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:15;pointer-events:none;
}
.music-album-disc{
  width:170px;height:170px;border-radius:50%;overflow:hidden;
  border:4px solid #222;box-shadow:0 8px 30px rgba(0,0,0,.9), 0 0 25px rgba(29,185,84,.4);
  animation:spin 25s linear infinite;
}
.music-album-disc img{width:100%;height:100%;object-fit:cover;}
@keyframes spin { 100% { transform: rotate(360deg); } }

.yt-watch-info{padding:1rem;}
.yt-watch-title{font-size:1.05rem;font-weight:700;line-height:1.4;}
.yt-watch-views{font-size:.8rem;color:var(--muted);margin-top:4px;}

/* ── MUSIC SEEK BAR & AUDIO FORWARD/BACKWARD CONTROLS ── */
.music-controls-panel{
  background:#181818;border:1px solid #303030;border-radius:14px;
  padding:.9rem 1rem;margin:.8rem 0;display:flex;flex-direction:column;gap:.7rem;
}
.music-seek-slider{width:100%;accent-color:var(--spotify-accent);cursor:pointer;}
.music-time-display{display:flex;justify-content:space-between;font-size:.78rem;color:#aaa;font-weight:500;}

.music-buttons-row{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:2px;}
.music-btn{
  background:#262626;border:1px solid #404040;border-radius:20px;color:#fff;
  padding:.5rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;
}
.music-btn:active{background:#3a3a3a;transform:scale(0.95);}
.music-play-main-btn{
  background:var(--spotify-accent);color:#000;border:none;border-radius:24px;
  padding:.65rem 1.6rem;font-size:1rem;font-weight:800;cursor:pointer;
  box-shadow:0 3px 12px rgba(29,185,84,.4);
}
.music-play-main-btn:active{transform:scale(0.95);}

.yt-channel-row{display:flex;align-items:center;justify-content:space-between;margin:.5rem 0;padding:.5rem 0;}
.yt-chan-left{display:flex;align-items:center;gap:.7rem;}
.yt-sub-btn{background:#fff;color:#000;border:none;border-radius:18px;padding:.45rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;}

.yt-actions-scroll{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none;}
.yt-act-pill{
  background:var(--pill-bg);border:none;border-radius:18px;color:#fff;
  padding:.5rem 1rem;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.4rem;
  white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.yt-act-pill.dl-accent{background:var(--accent);font-weight:700;}

/* ── DOWNLOAD MODAL ── */
.dl-modal{
  position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);
  display:none;align-items:flex-end;justify-content:center;
}
.dl-sheet{
  width:100%;background:#212121;border-radius:16px 16px 0 0;
  padding:1.5rem;display:flex;flex-direction:column;gap:1rem;
}
.dl-option{
  background:#333;border:none;border-radius:12px;color:#fff;
  padding:1rem;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.18);backdrop-filter:blur(12px);
  color:#fff;padding:.6rem 1.2rem;border-radius:20px;font-size:.85rem;font-weight:600;
  z-index:9999;display:none;pointer-events:none;white-space:nowrap;
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="app" id="appRoot">
  <!-- TOP HEADER -->
  <div class="yt-header">
    <div class="yt-logo" id="headerLogo" onclick="switchTab('home')">
      <div class="yt-logo-icon"></div>
      <span id="headerTitle">YouTube</span>
    </div>
    <div class="yt-hdr-actions">
      <button class="yt-hdr-icon" onclick="focusSearch()">🔍</button>
      <button class="yt-hdr-icon">🔔</button>
    </div>
  </div>

  <!-- SEARCH BAR -->
  <div class="yt-search-bar">
    <div class="yt-input-box">
      <span>🔍</span>
      <input type="text" id="searchInput"
        placeholder="Search YouTube..."
        oninput="toggleClearBtn()"
        onkeydown="handleSearchKey(event)"
        onblur="dismissKeyboard()" />
      <button type="button" class="yt-clear-btn" id="clearBtn"
        onpointerdown="clearSearch(event)"
        onclick="clearSearch(event)">✕</button>
    </div>
    <button class="yt-search-btn" onclick="doSearch()">Search</button>
  </div>

  <!-- GENRE CHIPS BAR -->
  <div class="ytm-genre-bar" id="ytmGenreBar"></div>

  <!-- FEED -->
  <div class="yt-feed" id="videoFeed">
    <div style="text-align:center;padding:3rem 1rem;color:#888;">
      Type any song or video name to search
    </div>
  </div>

  <!-- FLOATING MINI MUSIC PLAYER BAR -->
  <div class="mini-player-bar" id="miniPlayerBar" onclick="maximizePlayer()">
    <div class="mini-player-info">
      <img src="" id="miniPlayerImg" class="mini-player-img"/>
      <div>
        <div class="mini-player-title" id="miniPlayerTitle">Song Title</div>
        <div class="mini-player-artist" id="miniPlayerArtist">Artist Name</div>
      </div>
    </div>
    <div class="mini-player-controls" onclick="event.stopPropagation()">
      <button class="mini-btn" id="miniPlayBtn" onclick="togglePlayPause()">⏸</button>
      <button class="mini-btn" onclick="closeWatch()">✕</button>
    </div>
  </div>

  <!-- BOTTOM NAV BAR (HOME, YT MUSIC, SPOTIFY, APPLE MUSIC) -->
  <div class="yt-nav" id="mainNav">
    <div class="yt-nav-item active" id="navHome" onclick="switchTab('home')">
      <span class="yt-nav-icon">🏠</span>Home
    </div>
    <div class="yt-nav-item" id="navMusic" onclick="switchTab('music')">
      <span class="yt-nav-icon">🎵</span>YT Music
    </div>
    <div class="yt-nav-item" id="navSpotify" onclick="switchTab('spotify')">
      <span class="yt-nav-icon">💚</span>Spotify
    </div>
    <div class="yt-nav-item" id="navApple" onclick="switchTab('applemusic')">
      <span class="yt-nav-icon">🍎</span>Apple Music
    </div>
  </div>
</div>

<!-- GUARANTEED WORKING UNIFIED PLAYER SCREEN WITH AUDIO FORWARD/BACKWARD & SEEK BAR -->
<div class="yt-watch-screen" id="watchScreen">
  <div class="yt-watch-topbar">
    <button class="yt-back-btn" onclick="minimizePlayer()">↓ Minimize</button>
    <div style="font-weight:700;font-size:.9rem;" id="nowPlayingText">Now Playing</div>
    <div style="display:flex;gap:.6rem;align-items:center;">
      <button class="yt-back-btn" onclick="toggleFullscreen()" title="Fullscreen" style="font-size:1.3rem;">⛶</button>
    </div>
  </div>

  <div class="yt-player-box" id="playerBox">
    <div id="ytPlayerContainer"></div>
    <div class="music-album-overlay" id="musicAlbumOverlay">
      <div class="music-album-disc">
        <img src="" id="musicAlbumImg" />
      </div>
      <div style="font-size:.85rem;font-weight:700;color:var(--spotify-accent);margin-top:10px;" id="musicOverlayBadge">
        💚 Spotify Audio Player
      </div>
    </div>
  </div>

  <div class="yt-watch-info">
    <div class="yt-watch-title" id="wTitle">Song Title</div>
    <div class="yt-watch-views" id="wViews">Audio Track · Official Stream</div>

    <!-- AUDIO CONTROLS PANEL (SEEK BAR, MINUTES, REWIND 10s, FORWARD 10s) -->
    <div class="music-controls-panel">
      <div style="display:flex;flex-direction:column;gap:4px;">
        <input type="range" class="music-seek-slider" id="musicSeekSlider" value="0" min="0" max="100" oninput="seekTrack(this.value)" />
        <div class="music-time-display">
          <span id="musicCurTime">0:00</span>
          <span id="musicDurTime">0:00</span>
        </div>
      </div>
      <div class="music-buttons-row">
        <button class="music-btn" onclick="skipTrack(-10)">⏪ 10s</button>
        <button class="music-play-main-btn" id="musicMainPlayBtn" onclick="togglePlayPause()">⏸ Pause</button>
        <button class="music-btn" onclick="skipTrack(10)">⏩ 10s</button>
      </div>
    </div>

    <div class="yt-channel-row">
      <div class="yt-chan-left">
        <div class="yt-avatar" id="wAvatar">S</div>
        <div>
          <div style="font-weight:600;font-size:.9rem;" id="wChannel">Artist Name</div>
          <div style="font-size:.75rem;color:#aaa;" id="wBadge">Spotify MP3</div>
        </div>
      </div>
      <button class="yt-sub-btn" id="modeToggleBtn" onclick="toggleOverlayView()">🎵 Album Art</button>
    </div>

    <div class="yt-actions-scroll">
      <button class="yt-act-pill dl-accent" onclick="openDlModal()">⬇️ Download MP3 Song</button>
      <button class="yt-act-pill">👍 Like</button>
      <button class="yt-act-pill">↗️ Share</button>
    </div>
  </div>
</div>

<!-- DOWNLOAD SHEET -->
<div class="dl-modal" id="dlModal" onclick="closeDlModal()">
  <div class="dl-sheet" onclick="event.stopPropagation()">
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:.5rem;">Download Format</div>
    <button class="dl-option" onclick="triggerDownload('mp3')">
      🎵 Audio Only (MP3 Song) <span>⬇</span>
    </button>
    <button class="dl-option" onclick="triggerDownload('mp4')">
      🎬 Video (MP4 Video) <span>⬇</span>
    </button>
    <button style="background:none;border:none;color:#aaa;padding:.5rem;cursor:pointer;font-size:.95rem;" onclick="closeDlModal()">Cancel</button>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API = 'https://aura-music-player-rj2v.onrender.com';
let ytPlayer = null;
let currentVideo = null;
let backPressCount = 0;
let currentMode = 'youtube'; // 'youtube', 'ytmusic', 'spotify', 'applemusic'
let searchAbortController = null;
let seekTimer = null;

// ── YOUTUBE PLAYER INIT ──
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytPlayerContainer', {
    height: '100%', width: '100%',
    playerVars: { autoplay: 1, controls: 1, rel: 0, playsinline: 1, enablejsapi: 1, fs: 1 },
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerStateChange(e) {
  const btn = document.getElementById('musicMainPlayBtn');
  const miniBtn = document.getElementById('miniPlayBtn');

  if (e.data === YT.PlayerState.PLAYING) {
    if (btn) btn.textContent = '⏸ Pause';
    if (miniBtn) miniBtn.textContent = '⏸';
    startSeekTimer();
  } else {
    if (btn) btn.textContent = '▶ Play';
    if (miniBtn) miniBtn.textContent = '▶';
    stopSeekTimer();
  }
}

function startSeekTimer() {
  stopSeekTimer();
  seekTimer = setInterval(() => {
    if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
      const cur = ytPlayer.getCurrentTime() || 0;
      const dur = ytPlayer.getDuration() || 1;
      const pct = (cur / dur) * 100;
      document.getElementById('musicSeekSlider').value = pct;
      document.getElementById('musicCurTime').textContent = fmtSec(cur);
      document.getElementById('musicDurTime').textContent = fmtSec(dur);
    }
  }, 1000);
}

function stopSeekTimer() {
  if (seekTimer) clearInterval(seekTimer);
}

function togglePlayPause() {
  if (!ytPlayer || !ytPlayer.getPlayerState) return;
  const state = ytPlayer.getPlayerState();
  if (state === YT.PlayerState.PLAYING) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
}

function seekTrack(val) {
  if (ytPlayer && ytPlayer.getDuration) {
    const dur = ytPlayer.getDuration() || 0;
    ytPlayer.seekTo((val / 100) * dur, true);
  }
}

function skipTrack(sec) {
  if (ytPlayer && ytPlayer.getCurrentTime) {
    const cur = ytPlayer.getCurrentTime() || 0;
    ytPlayer.seekTo(cur + sec, true);
  }
}

// ── SEARCH INPUT HANDLING ──
function focusSearch() {
  document.getElementById('searchInput').focus();
}

function toggleClearBtn() {
  const input = document.getElementById('searchInput');
  document.getElementById('clearBtn').style.display = input.value.length > 0 ? 'inline-block' : 'none';
}

function clearSearch(e) {
  if (e) {
    try { e.preventDefault(); e.stopPropagation(); } catch(err){}
  }
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('clearBtn').style.display = 'none';
  
  input.blur();
  if (document.activeElement) document.activeElement.blur();
  // DO NOT STOP CURRENTLY PLAYING MUSIC!
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    e.target.blur();
    doSearch();
  }
}

function dismissKeyboard() {}

function searchGenre(genreQuery) {
  const si = document.getElementById('searchInput');
  si.value = genreQuery;
  toggleClearBtn();
  doSearch();
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  if (searchAbortController) {
    try { searchAbortController.abort(); } catch(err){}
  }
  searchAbortController = new AbortController();

  const feed = document.getElementById('videoFeed');
  
  let endpoint = `${API}/api/search/youtube`;
  let label = '🔍 Searching YouTube...';

  if (currentMode === 'ytmusic') {
    endpoint = `${API}/api/search/ytmusic`;
    label = '🎵 Pulling MP3 songs from YouTube Music...';
  } else if (currentMode === 'spotify') {
    endpoint = `${API}/api/search/spotify`;
    label = '💚 Pulling MP3 songs from Spotify Hits...';
  } else if (currentMode === 'applemusic') {
    endpoint = `${API}/api/search/applemusic`;
    label = '🍎 Pulling MP3 songs from Apple Music Top Charts...';
  }

  feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">${label}</div>`;

  try {
    const timeoutId = setTimeout(() => searchAbortController.abort(), 10000);
    const r = await fetch(`${endpoint}?q=${encodeURIComponent(q)}`, { signal: searchAbortController.signal });
    clearTimeout(timeoutId);
    
    if (!r.ok) {
      const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
      const fallbackData = await fallbackR.json();
      renderFeed(fallbackData.results || []);
      return;
    }
    
    const data = await r.json();
    if (data.results && data.results.length > 0) {
      renderFeed(data.results);
    } else {
      const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
      const fallbackData = await fallbackR.json();
      renderFeed(fallbackData.results || []);
    }
  } catch(e) {
    if (e.name === 'AbortError') {
      feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">Search reset. <br/><br/><button style="background:#333;color:#fff;border:none;padding:.5rem 1rem;border-radius:16px;" onclick="doSearch()">Retry</button></div>`;
    } else {
      try {
        const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
        const fallbackData = await fallbackR.json();
        renderFeed(fallbackData.results || []);
      } catch(err2) {
        feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">No results found. <br/><br/><button style="background:#333;color:#fff;border:none;padding:.5rem 1rem;border-radius:16px;" onclick="doSearch()">Retry</button></div>`;
      }
    }
  }
}

function renderFeed(list) {
  const feed = document.getElementById('videoFeed');
  if (!list || !list.length) {
    feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">No results found</div>`;
    return;
  }

  feed.innerHTML = list.map(item => {
    let badgeHtml = '';
    if (currentMode === 'ytmusic') badgeHtml = '<div class="ytm-badge">🎵 YT Music MP3</div>';
    else if (currentMode === 'spotify') badgeHtml = '<div class="spotify-badge">💚 Spotify MP3</div>';
    else if (currentMode === 'applemusic') badgeHtml = '<div class="applemusic-badge">🍎 Apple Music MP3</div>';

    let subtext = item.artist;
    if (currentMode === 'spotify') subtext = `Spotify Audio MP3 · ${item.artist}`;
    else if (currentMode === 'applemusic') subtext = `Apple Music Audio MP3 · ${item.artist}`;
    else if (currentMode === 'ytmusic') subtext = `YouTube Music MP3 · ${item.artist}`;

    return `
    <div class="yt-card" onclick="openWatch('${item.id}','${escHtml(item.title)}','${escHtml(item.artist)}','${item.thumbnail}')">
      <div class="yt-thumb-wrap">
        <img src="${item.thumbnail}" loading="lazy"/>
        <div class="yt-dur">${fmtSec(item.duration)}</div>
        ${badgeHtml}
      </div>
      <div class="yt-details">
        <div class="yt-avatar">${(item.artist||'S')[0].toUpperCase()}</div>
        <div class="yt-meta">
          <div class="yt-title">${item.title}</div>
          <div class="yt-subtext">${subtext}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── PLAY PLAYER SCREEN & MINI PLAYER BAR ──
function openWatch(id, title, artist, thumb) {
  currentVideo = { id, title, artist, thumb };
  document.getElementById('wTitle').textContent = title;
  document.getElementById('wChannel').textContent = artist;
  document.getElementById('wAvatar').textContent = (artist||'S')[0].toUpperCase();

  // Update Mini Player Bar
  document.getElementById('miniPlayerImg').src = thumb;
  document.getElementById('miniPlayerTitle').textContent = title;
  document.getElementById('miniPlayerArtist').textContent = artist;

  const overlay = document.getElementById('musicAlbumOverlay');
  const overlayImg = document.getElementById('musicAlbumImg');
  const overlayBadge = document.getElementById('musicOverlayBadge');
  const playBtn = document.getElementById('musicMainPlayBtn');
  overlayImg.src = thumb;

  let modeBadge = 'YouTube';
  let accentColor = 'var(--spotify-accent)';

  if (currentMode === 'spotify') {
    modeBadge = 'Spotify MP3 Audio';
    accentColor = 'var(--spotify-accent)';
    overlay.style.display = 'flex';
    overlayBadge.textContent = '💚 Spotify Audio Player';
    overlayBadge.style.color = accentColor;
  } else if (currentMode === 'applemusic') {
    modeBadge = 'Apple Music MP3 Audio';
    accentColor = 'var(--applemusic-accent)';
    overlay.style.display = 'flex';
    overlayBadge.textContent = '🍎 Apple Music Audio Player';
    overlayBadge.style.color = accentColor;
  } else {
    overlay.style.display = 'none';
    if (currentMode === 'ytmusic') {
      modeBadge = 'YouTube Music MP3';
      accentColor = 'var(--ytmusic-accent)';
    } else {
      accentColor = 'var(--accent)';
    }
  }

  document.getElementById('musicSeekSlider').style.accentColor = accentColor;
  playBtn.style.background = accentColor;
  document.getElementById('miniPlayerArtist').style.color = accentColor;

  document.getElementById('wBadge').textContent = modeBadge;
  document.getElementById('nowPlayingText').textContent = `🎵 ${modeBadge}`;

  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  const ws = document.getElementById('watchScreen');
  ws.style.display = 'flex';
  document.getElementById('miniPlayerBar').style.display = 'none';

  if (ytPlayer) {
    if (ytPlayer.loadVideoById) {
      ytPlayer.loadVideoById(id);
    }
    setTimeout(() => {
      if (ytPlayer.playVideo) ytPlayer.playVideo();
    }, 150);
  }

  checkAutoOrientation();
}

function minimizePlayer() {
  const ws = document.getElementById('watchScreen');
  ws.style.display = 'none';
  if (currentVideo) {
    document.getElementById('miniPlayerBar').style.display = 'flex';
  }
}

function maximizePlayer() {
  const ws = document.getElementById('watchScreen');
  ws.style.display = 'flex';
  document.getElementById('miniPlayerBar').style.display = 'none';
}

function toggleOverlayView() {
  const overlay = document.getElementById('musicAlbumOverlay');
  if (overlay.style.display === 'flex') {
    overlay.style.display = 'none';
  } else {
    overlay.style.display = 'flex';
  }
}

function handleBackFromWatch() {
  minimizePlayer();
}

function closeWatch() {
  const ws = document.getElementById('watchScreen');
  ws.style.display = 'none';
  ws.classList.remove('is-fullscreen');
  document.body.classList.remove('is-landscape');
  document.getElementById('mainNav').style.display = 'flex';
  document.getElementById('miniPlayerBar').style.display = 'none';
  currentVideo = null;
  if (ytPlayer && ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch(e){} }
  stopSeekTimer();

  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();
}

function toggleFullscreen() {
  const ws = document.getElementById('watchScreen');
  if (ws.style.display !== 'flex') ws.style.display = 'flex';
  ws.classList.toggle('is-fullscreen');
  document.getElementById('mainNav').style.display = ws.classList.contains('is-fullscreen') ? 'none' : 'flex';
}

// ── DOWNLOAD ──
function openDlModal() {
  if (!currentVideo) { showToast('Open a track first'); return; }
  document.getElementById('dlModal').style.display = 'flex';
}
function closeDlModal() {
  document.getElementById('dlModal').style.display = 'none';
}

function triggerDownload(format) {
  if (!currentVideo) return;
  closeDlModal();
  showToast(`Opening ${format.toUpperCase()} Downloader...`);

  const dlUrl = `https://y2mate.is/en/youtube-to-mp3/${currentVideo.id}`;

  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
      window.Capacitor.Plugins.Browser.open({ url: dlUrl });
    } else {
      window.open(dlUrl, '_system');
    }
  } catch(e) {
    window.open(dlUrl, '_system');
  }
}

// ── TOAST ──
function showToast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// ── TAB SWITCHING (KEEP MUSIC PLAYING WHILE SWITCHING TABS OR SEARCHING!) ──
function switchTab(tab) {
  document.querySelectorAll('.yt-nav-item').forEach(el => el.classList.remove('active'));
  const feed = document.getElementById('videoFeed');
  const si = document.getElementById('searchInput');
  const logo = document.getElementById('headerLogo');
  const title = document.getElementById('headerTitle');
  const genreBar = document.getElementById('ytmGenreBar');

  logo.className = 'yt-logo';

  if (tab === 'home') {
    currentMode = 'youtube';
    title.textContent = 'YouTube';
    si.placeholder = 'Search YouTube videos & music...';
    genreBar.style.display = 'none';
    document.getElementById('navHome').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">Type any song or video name to search</div>`;
  } else if (tab === 'music') {
    currentMode = 'ytmusic';
    logo.classList.add('ytmusic');
    title.textContent = 'YouTube Music';
    si.placeholder = 'Search YouTube Music songs...';
    genreBar.style.display = 'flex';
    genreBar.innerHTML = `
      <div class="ytm-genre-chip" onclick="searchGenre('Trending Songs 2026')">🔥 Trending MP3</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Top Audio Songs')">🎤 Top Songs</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Romantic Love Songs')">❤️ Romantic MP3</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Punjabi Beats')">💃 Punjabi Beats</div>
    `;
    document.getElementById('navMusic').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">🎵 Search any song from YouTube Music or tap a category above</div>`;
  } else if (tab === 'spotify') {
    currentMode = 'spotify';
    logo.classList.add('spotify');
    title.textContent = 'Spotify Hits';
    si.placeholder = 'Search Spotify MP3 songs...';
    genreBar.style.display = 'flex';
    genreBar.innerHTML = `
      <div class="ytm-genre-chip" onclick="searchGenre('Spotify Top 50 Global')">💚 Top 50 Global</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Spotify Trending Audio')">🔥 Trending Audio</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Spotify Pop Hits')">🎸 Pop Hits</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Spotify Chill Out')">☕ Chill Beats</div>
    `;
    document.getElementById('navSpotify').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">💚 Search any song from Spotify MP3 or tap a category above</div>`;
  } else if (tab === 'applemusic') {
    currentMode = 'applemusic';
    logo.classList.add('applemusic');
    title.textContent = 'Apple Music';
    si.placeholder = 'Search Apple Music songs...';
    genreBar.style.display = 'flex';
    genreBar.innerHTML = `
      <div class="ytm-genre-chip" onclick="searchGenre('Apple Music Top 100')">🍎 Top 100 Charts</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Apple Music New Releases')">🎵 New Releases</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Apple Music Hits')">⚡ Global Hits</div>
    `;
    document.getElementById('navApple').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">🍎 Search any song from Apple Music MP3 or tap a category above</div>`;
  }
}

// ── HARDWARE BACK BUTTON ──
function handleHardwareBack() {
  const dlModal = document.getElementById('dlModal');
  const ws = document.getElementById('watchScreen');
  const si = document.getElementById('searchInput');

  document.activeElement && document.activeElement.blur();

  if (dlModal.style.display === 'flex') { closeDlModal(); return true; }
  if (ws.classList.contains('is-fullscreen')) {
    ws.classList.remove('is-fullscreen');
    document.getElementById('mainNav').style.display = 'flex';
    return true;
  }
  if (ws.style.display === 'flex') { minimizePlayer(); return true; }

  if (si.value.length > 0) {
    clearSearch();
    return true;
  }

  backPressCount++;
  if (backPressCount === 1) {
    showToast('Press back again to exit');
    setTimeout(() => { backPressCount = 0; }, 2000);
    return true;
  } else if (backPressCount >= 2) {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)
      window.Capacitor.Plugins.App.exitApp();
  }
  return false;
}

// ── ORIENTATION FULLSCREEN ──
function checkAutoOrientation() {
  const ws = document.getElementById('watchScreen');
  const nav = document.getElementById('mainNav');
  const isLandscape = window.innerWidth > window.innerHeight;

  if (isLandscape) {
    document.body.classList.add('is-landscape');
    nav.style.display = 'none';
    if (ws && ws.style.display === 'flex') ws.classList.add('is-fullscreen');
  } else {
    document.body.classList.remove('is-landscape');
    if (ws && !ws.classList.contains('is-fullscreen')) nav.style.display = 'flex';
  }
}

window.addEventListener('resize', checkAutoOrientation);
window.addEventListener('orientationchange', checkAutoOrientation);

// ── PREVENT CHROME REDIRECTS ──
window.open = function(url, target) {
  if (target === '_system' && url) {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return null;
  }
  return null;
};
document.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (a && a.href && (a.href.includes('youtube.com') || a.href.includes('youtu.be'))) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, true);

// ── CAPACITOR BACK BUTTON ──
document.addEventListener('DOMContentLoaded', () => {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('backButton', handleHardwareBack);
  }
});

// ── HELPERS ──
function escHtml(str) {
  return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function fmtSec(sec) {
  if (!sec) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
