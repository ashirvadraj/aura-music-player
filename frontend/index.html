<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Aura — YouTube Player & Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f17;--surface:rgba(255,255,255,.06);--border:rgba(255,255,255,.09);
  --text:#f0f0f8;--muted:rgba(255,255,255,.45);--accent:#ff0033;--accent-glow:rgba(255,0,51,.35);
  --card:rgba(255,255,255,.05);
}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);user-select:none;}

/* ── ANIMATED BACKGROUND ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 80%,rgba(255,0,51,.15) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 20%,rgba(168,85,247,.12) 0%,transparent 70%);
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{0%{opacity:.7}100%{opacity:1}}

/* ── MAIN APP LAYOUT ── */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}

/* ── HEADER ── */
.header{
  padding:1rem 1.4rem .8rem;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,15,23,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.logo{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:.4rem;color:#fff;}
.logo span{color:var(--accent);}

/* ── SEARCH BAR ── */
.search-row{padding:.8rem 1.4rem;flex-shrink:0;display:flex;gap:.5rem;}
.search-box{
  flex:1;display:flex;align-items:center;gap:.6rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:.6rem 1rem;transition:border-color .2s;
}
.search-box:focus-within{border-color:var(--accent);}
.search-box input{flex:1;background:none;border:none;outline:none;font:inherit;font-size:.95rem;color:var(--text);}
.search-box input::placeholder{color:var(--muted);}
.search-btn{background:linear-gradient(135deg,#ff0033,#cc0029);border:none;border-radius:12px;color:#fff;padding:.6rem 1.2rem;font:.9rem/1 'Inter',sans-serif;font-weight:700;cursor:pointer;}

/* ── SCROLL CONTENT AREA ── */
.scroll{flex:1;overflow-y:auto;padding:.4rem 1.4rem 6rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

/* ── TRACK ITEM ── */
.track{
  display:flex;align-items:center;gap:.85rem;
  padding:.75rem;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  margin-bottom:.6rem;cursor:pointer;
  transition:transform .18s,border-color .18s;
}
.track:hover{transform:translateX(3px);border-color:rgba(255,0,51,.4);}
.track.playing{border-color:var(--accent);background:rgba(255,0,51,.1);}
.track-thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.08);}
.track-info{flex:1;min-width:0;}
.track-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-size:.75rem;color:var(--muted);margin-top:.25rem;}
.track-actions{display:flex;gap:.4rem;align-items:center;flex-shrink:0;}
.act-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:.8rem;padding:.4rem .6rem;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:.3rem;}
.act-btn:hover{background:rgba(255,0,51,.2);border-color:var(--accent);}

/* ── STATE MSGS ── */
.state-msg{text-align:center;padding:4rem 1rem;color:var(--muted);}
.state-msg .icon{font-size:2.8rem;margin-bottom:.6rem;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MINI PLAYER BAR ── */
.mini-player{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(18,18,28,.96);backdrop-filter:blur(25px);
  border-top:1px solid var(--border);
  padding:.6rem 1.2rem;display:none;align-items:center;gap:.8rem;z-index:100;
}
.mini-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.mini-info{flex:1;min-width:0;}
.mini-title{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:.72rem;color:var(--muted);margin-top:.15rem;}
.mini-controls{display:flex;align-items:center;gap:.5rem;}
.play-btn-circle{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 15px var(--accent-glow);}

/* ── FULL PLAYER MODAL ── */
.full-player{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:none;flex-direction:column;max-width:480px;margin:0 auto;
  padding:1.5rem;overflow-y:auto;
}
.fp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;}
.fp-close{background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer;}
.fp-media-box{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;position:relative;margin-bottom:1.5rem;box-shadow:0 8px 30px rgba(0,0,0,.6);}
#playerIframe{width:100%;height:100%;border:none;}
.fp-title{font-size:1.1rem;font-weight:700;margin-bottom:.3rem;text-align:center;}
.fp-artist{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:1.5rem;}
.fp-actions-row{display:flex;justify-content:center;gap:1rem;margin-top:1rem;}
.dl-btn-lg{background:linear-gradient(135deg,#ff0033,#cc0029);border:none;border-radius:12px;color:#fff;padding:.8rem 1.8rem;font-size:.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:.5rem;}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo"><span>🔴</span> Aura Music</div>
  </div>

  <div class="search-row">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search YouTube songs, videos..." onkeydown="if(event.key==='Enter')doSearch()"/>
    </div>
    <button class="search-btn" onclick="doSearch()">Search</button>
  </div>

  <div class="scroll" id="results">
    <div class="state-msg">
      <div class="icon">🎵</div>
      <div>Type a song name above to start listening</div>
    </div>
  </div>

  <!-- MINI PLAYER -->
  <div class="mini-player" id="miniPlayer">
    <img class="mini-thumb" id="miniThumb" src="" onclick="openFullPlayer()"/>
    <div class="mini-info" onclick="openFullPlayer()">
      <div class="mini-title" id="miniTitle">Song Title</div>
      <div class="mini-artist" id="miniArtist">Channel</div>
    </div>
    <div class="mini-controls">
      <button class="play-btn-circle" id="miniPlayBtn" onclick="togglePlay()">⏸</button>
    </div>
  </div>
</div>

<!-- FULL PLAYER MODAL -->
<div class="full-player" id="fullPlayer">
  <div class="fp-header">
    <button class="fp-close" onclick="closeFullPlayer()">✕</button>
    <div style="font-weight:700;font-size:.9rem;">Now Playing</div>
    <div style="width:24px;"></div>
  </div>

  <div class="fp-media-box">
    <div id="ytIframeContainer"></div>
  </div>

  <div class="fp-title" id="fpTitle">Track Title</div>
  <div class="fp-artist" id="fpArtist">Channel Name</div>

  <div class="fp-actions-row">
    <button class="dl-btn-lg" onclick="downloadCurrent('mp3')">⬇ Download MP3</button>
    <button class="dl-btn-lg" style="background:rgba(255,255,255,.1);border:1px solid var(--border);" onclick="downloadCurrent('mp4')">🎬 Download MP4</button>
  </div>
</div>

<!-- YOUTUBE IFRAME API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API = 'https://aura-music-player-rj2v.onrender.com';
let ytPlayer = null;
let currentTrack = null;
let isPlaying = false;

// 1. YouTube IFrame API Ready Callback
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytIframeContainer', {
    height: '100%',
    width: '100%',
    playerVars: {
      'autoplay': 1,
      'controls': 1,
      'rel': 0,
      'playsinline': 1
    },
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    isPlaying = true;
    document.getElementById('miniPlayBtn').textContent = '⏸';
  } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
    isPlaying = false;
    document.getElementById('miniPlayBtn').textContent = '▶';
  }
}

// 2. SEARCH
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  
  const resEl = document.getElementById('results');
  resEl.innerHTML = `<div class="state-msg"><div class="spinner"></div><div>Searching YouTube...</div></div>`;

  try {
    const r = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    showResults(data.results || []);
  } catch(e) {
    resEl.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><div>Could not fetch results. Try again.</div></div>`;
  }
}

function showResults(list) {
  const resEl = document.getElementById('results');
  if(!list.length) {
    resEl.innerHTML = `<div class="state-msg"><div class="icon">📭</div><div>No songs found</div></div>`;
    return;
  }

  resEl.innerHTML = list.map(item => `
    <div class="track${currentTrack && currentTrack.id === item.id ? ' playing' : ''}" onclick="playVideo('${item.id}', '${escapeHtml(item.title)}', '${escapeHtml(item.artist)}', '${item.thumbnail}')">
      <img class="track-thumb" src="${item.thumbnail}"/>
      <div class="track-info">
        <div class="track-title">${item.title}</div>
        <div class="track-artist">${item.artist || 'YouTube'} · ${fmtSec(item.duration)}</div>
      </div>
      <div class="track-actions">
        <button class="act-btn" onclick="event.stopPropagation();downloadItem('${item.id}', '${escapeHtml(item.title)}', 'mp3')">⬇ MP3</button>
      </div>
    </div>
  `).join('');
}

function playVideo(id, title, artist, thumb) {
  currentTrack = { id, title, artist, thumb };
  
  document.getElementById('miniThumb').src = thumb;
  document.getElementById('miniTitle').textContent = title;
  document.getElementById('miniArtist').textContent = artist;
  document.getElementById('miniPlayer').style.display = 'flex';

  document.getElementById('fpTitle').textContent = title;
  document.getElementById('fpArtist').textContent = artist;

  if (ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById(id);
  }
}

function togglePlay() {
  if (!ytPlayer) return;
  if (isPlaying) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
}

function openFullPlayer() {
  document.getElementById('fullPlayer').style.display = 'flex';
}

function closeFullPlayer() {
  document.getElementById('fullPlayer').style.display = 'none';
}

function downloadItem(id, title, format) {
  const dlUrl = `${API}/api/download?videoId=${encodeURIComponent(id)}&title=${encodeURIComponent(title)}&format=${format}`;
  window.open(dlUrl, '_blank');
}

function downloadCurrent(format) {
  if (!currentTrack) return;
  downloadItem(currentTrack.id, currentTrack.title, format);
}

function escapeHtml(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function fmtSec(sec) {
  if (!sec) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
</script>

</body>
</html>
