<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Aura Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--surface:#212121;--border:#383838;
  --text:#f1f1f1;--muted:#aaa;--accent:#ff0000;
  --ytmusic-accent:#ff0033;
  --spotify-accent:#1db954;
  --applemusic-accent:#fa243c;
  --pill-bg:rgba(255,255,255,.1);
  --safe-top: max(32px, env(safe-area-inset-top));
}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);user-select:none;}

/* ANDROID WEBVIEW INPUT TYPING FIX */
input, textarea, [contenteditable="true"] {
  user-select: text !important;
  -webkit-user-select: text !important;
}

.app{height:100%;width:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);}

/* ── RESUME PLAYBACK BANNER (POSITIONED AT BOTTOM DIRECTLY ABOVE NAV BAR) ── */
.resume-banner {
  position: fixed; bottom: 56px; left: 0; right: 0;
  background: linear-gradient(90deg, #ff0000, #990000);
  color: #fff; padding: .55rem 1rem; font-size: .82rem; font-weight: 600;
  display: none; align-items: center; justify-content: space-between;
  cursor: pointer; z-index: 950; box-shadow: 0 -2px 10px rgba(0,0,0,.6);
  border-top: 1px solid rgba(255,255,255,.2);
}
.resume-banner-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
.resume-btn-chip { background: #fff; color: #000; padding: 3px 12px; border-radius: 12px; font-weight: 800; font-size: .75rem; }

/* ── TOP HEADER ── */
.yt-header{
  height:calc(52px + var(--safe-top));
  padding-top:var(--safe-top);
  padding-left:1rem;padding-right:1rem;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;z-index:10;
}
.yt-logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;letter-spacing:-.5px;cursor:pointer;}
.yt-logo-icon{width:30px;height:22px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
.yt-logo-icon::after{content:'';border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent #fff;margin-left:2px;}
.yt-logo.ytmusic .yt-logo-icon{background:var(--ytmusic-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.ytmusic .yt-logo-icon::after{border-width:4px 0 4px 7px;}
.yt-logo.spotify .yt-logo-icon{background:var(--spotify-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.spotify .yt-logo-icon::after{content:'💚';border:none;font-size:.8rem;margin:0;}
.yt-logo.applemusic .yt-logo-icon{background:var(--applemusic-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.applemusic .yt-logo-icon::after{content:'🍎';border:none;font-size:.8rem;margin:0;}
.yt-logo.favorites .yt-logo-icon{background:#ff2d55;border-radius:50%;width:26px;height:26px;}
.yt-logo.favorites .yt-logo-icon::after{content:'❤️';border:none;font-size:.8rem;margin:0;}

.yt-hdr-actions{display:flex;align-items:center;gap:1.2rem;}
.yt-hdr-icon{font-size:1.2rem;cursor:pointer;color:var(--text);background:none;border:none;display:flex;align-items:center;gap:4px;}
.love-badge-count{background:#ff2d55;color:#fff;font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:10px;}

/* ── SEARCH BAR & LIVE AUTO-SUGGESTIONS ── */
.yt-search-bar{
  padding:.6rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;gap:.5rem;align-items:center;flex-shrink:0;z-index:100;position:relative;
}
.yt-input-box{
  flex:1;background:#121212;border:1px solid #303030;border-radius:20px;
  padding:.4rem .8rem;display:flex;align-items:center;gap:.6rem;position:relative;
}
.yt-input-box input{
  flex:1;background:none;border:none;outline:none;color:#fff;font-size:.95rem;
  user-select:text !important;-webkit-user-select:text !important;
}
.yt-clear-btn{
  background:none;border:none;color:var(--muted);font-size:1.2rem;
  cursor:pointer;display:none;padding:.2rem .6rem;z-index:50;
  touch-action:manipulation;-webkit-user-select:none;
}
.yt-clear-btn:active{color:#fff;transform:scale(1.2);}
.yt-search-btn{background:#222;border:1px solid #303030;border-radius:20px;color:#fff;padding:.45rem 1rem;font-weight:500;cursor:pointer;flex-shrink:0;}

/* AUTO-SUGGESTIONS DROPDOWN CONTAINER */
.search-suggestions-box {
  position: absolute; top: 100%; left: 1rem; right: 1rem;
  background: #1c1c1e; border: 1px solid #333; border-radius: 0 0 16px 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.8); z-index: 1000; display: none;
  max-height: 240px; overflow-y: auto;
}
.suggestion-item {
  padding: .65rem 1rem; font-size: .9rem; color: #ddd; border-bottom: 1px solid rgba(255,255,255,.05);
  display: flex; align-items: center; gap: .6rem; cursor: pointer;
}
.suggestion-item:active { background: #333; color: #fff; }

/* ── MUSIC GENRE CHIPS BAR ── */
.ytm-genre-bar{
  display:none;gap:.5rem;overflow-x:auto;padding:.6rem 1rem;background:#141414;
  border-bottom:1px solid rgba(255,255,255,.05);scrollbar-width:none;flex-shrink:0;
}
.ytm-genre-chip{
  background:var(--pill-bg);border:1px solid rgba(255,255,255,.1);border-radius:16px;
  color:#fff;padding:.35rem .8rem;font-size:.78rem;font-weight:500;white-space:nowrap;cursor:pointer;
}
.ytm-genre-chip:active{background:var(--accent);}

/* ── FEED / SCROLL ── */
.yt-feed{flex:1;overflow-y:auto;padding-bottom:120px;}

/* ── CARD LAYOUTS ── */
.yt-card{margin-bottom:1.2rem;cursor:pointer;position:relative;}
.yt-thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#1e1e1e;}
.yt-thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.yt-dur{
  position:absolute;bottom:8px;right:8px;
  background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:500;
  padding:2px 5px;border-radius:4px;
}
.ytm-badge{
  position:absolute;top:8px;left:8px;
  background:var(--ytmusic-accent);color:#fff;font-size:.7rem;font-weight:700;
  padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;
}
.spotify-badge{
  position:absolute;top:8px;left:8px;
  background:var(--spotify-accent);color:#000;font-size:.7rem;font-weight:700;
  padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;
}
.applemusic-badge{
  position:absolute;top:8px;left:8px;
  background:var(--applemusic-accent);color:#fff;font-size:.7rem;font-weight:700;
  padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;
}
/* CARD LOVE HEART BUTTON */
.card-love-btn{
  position:absolute;top:8px;right:8px;z-index:15;
  background:rgba(0,0,0,.65);border:none;border-radius:50%;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;cursor:pointer;backdrop-filter:blur(6px);transition:transform .2s;
}
.card-love-btn:active{transform:scale(1.25);}
.card-love-btn.is-loved{background:rgba(255,45,85,.85);color:#fff;}

.yt-details{display:flex;gap:.8rem;padding:.8rem 1rem 0;}
.yt-avatar{width:36px;height:36px;border-radius:50%;background:#333;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
.yt-meta{flex:1;min-width:0;}
.yt-title{font-size:.92rem;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.yt-subtext{font-size:.78rem;color:var(--muted);margin-top:4px;}

/* ── FLOATING MINI MUSIC PLAYER BAR ── */
.mini-player-bar{
  position:fixed;bottom:56px;left:0;right:0;height:52px;
  background:#1c1c1e;border-top:1px solid rgba(255,255,255,.12);
  display:none;align-items:center;justify-content:space-between;padding:0 .8rem;
  z-index:900;cursor:pointer;backdrop-filter:blur(10px);
}
.mini-player-info{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;}
.mini-player-img{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0;}
.mini-player-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-player-artist{font-size:.72rem;color:var(--spotify-accent);}
.mini-player-controls{display:flex;align-items:center;gap:.6rem;}
.mini-btn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:2px 6px;}

/* ── BOTTOM NAV BAR ── */
.yt-nav{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:#0f0f0f;border-top:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:space-around;z-index:999;
}
.yt-nav-item{
  flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:.68rem;color:var(--muted);cursor:pointer;pointer-events:auto;
}
.yt-nav-item.active{color:#fff;font-weight:700;}
.yt-nav-icon{font-size:1.2rem;}

/* ── UNIFIED WATCH PLAYER SCREEN ── */
.yt-watch-screen{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:none;flex-direction:column;width:100%;height:100%;overflow-y:auto;
  touch-action:pan-y pinch-zoom;
}

/* OFF-SCREEN POSITIONAL MINIMIZE FOR NON-STOP BACKGROUND PLAYBACK */
.yt-watch-screen.is-minimized {
  display: flex !important;
  position: fixed !important;
  top: -9999px !important; left: -9999px !important;
  width: 1px !important; height: 1px !important;
  opacity: 0.001 !important; pointer-events: none !important;
  z-index: -999 !important; overflow: hidden !important;
}

.yt-watch-topbar{
  height:calc(48px + var(--safe-top));
  padding-top:var(--safe-top);
  padding-left:1rem;padding-right:1rem;
  display:flex;align-items:center;justify-content:space-between;
  background:#121212;border-bottom:1px solid var(--border);flex-shrink:0;
}
.yt-back-btn{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:.2rem .5rem;}

.yt-player-box{
  width:100%;aspect-ratio:16/9;background:#000;position:relative;z-index:10;
  overflow:hidden;touch-action:manipulation;
}

/* ZOOM WRAPPER CONTAINER */
.zoom-wrapper {
  width:100%;height:100%;
  transition:transform 0.15s ease-out;
  transform-origin:center center;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
#ytPlayerContainer{width:100%;height:100%;border:none;overflow:hidden;position:relative;}
#ytPlayerContainer iframe{
  width:100%!important;height:100%!important;border:none!important;
}

/* NON-BLOCKING FLOATING LANDSCAPE/PORTRAIT ZOOM CHIP */
.player-zoom-chip-bar {
  position: absolute; top: max(10px, env(safe-area-inset-top)); right: 12px;
  z-index: 9999; display: flex; align-items: center; gap: .5rem;
  pointer-events: none;
}
.player-zoom-chip {
  pointer-events: auto !important;
  background: rgba(0,0,0,.75); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.25); border-radius: 16px;
  color: #fff; padding: .35rem .75rem; font-size: .78rem; font-weight: 700;
  cursor: pointer; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.6);
}
.player-zoom-chip:active { background: #ff0000; }

/* ── AUDIO SEEK SLIDER (SHOWS ONLY IN SPOTIFY/APPLE MUSIC AUDIO MODES) ── */
.yt-red-slider-container {
  width: 100%; padding: 8px 1rem 4px; background: #121212;
  display: none; flex-direction: column; gap: 4px; border-bottom: 1px solid #222;
}
body.audio-mode .yt-red-slider-container {
  display: flex !important;
}
.yt-red-slider-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: .75rem; color: #bbb; font-weight: 600; font-family: 'Roboto', sans-serif;
}
.yt-red-seek-input {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 5px; background: rgba(255,255,255,0.2);
  border-radius: 3px; outline: none; cursor: pointer;
}
.yt-red-seek-input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--spotify-accent); cursor: pointer; box-shadow: 0 0 8px rgba(29,185,84,0.8);
  transition: transform 0.15s ease;
}
.yt-red-seek-input:active::-webkit-slider-thumb {
  transform: scale(1.4);
}

/* ── 100% ORIGINAL YOUTUBE CONTROLS IN LANDSCAPE MODE ── */
@media screen and (orientation: landscape) {
  body.has-open-player .yt-watch-topbar,
  body.has-open-player .yt-watch-info,
  body.has-open-player .yt-nav,
  body.has-open-player .mini-player-bar,
  body.has-open-player .yt-header,
  body.has-open-player .yt-search-bar { display: none !important; }

  body.has-open-player #watchScreen,
  body.has-open-player .yt-player-box,
  body.has-open-player #ytPlayerContainer {
    position: fixed !important;
    top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100vw !important; height: 100vh !important;
    max-width: 100vw !important; max-height: 100vh !important;
    margin: 0 !important; padding: 0 !important;
    z-index: 999999 !important; background: #000 !important;
    overflow: hidden !important;
  }

  body.has-open-player #zoomWrapper {
    width: 100vw !important; height: 100vh !important;
    position: absolute !important; inset: 0 !important;
    display: flex !important; align-items: center !important; justify-content: center !important;
  }

  body.has-open-player #ytPlayerContainer iframe {
    width: 100vw !important; height: 100vh !important;
    border: none !important;
  }
}

/* SPOTIFY / APPLE MUSIC ALBUM ART OVERLAY OVER PLAYER BOX */
.music-album-overlay{
  position:absolute;inset:0;background:#0b0b0b;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:15;pointer-events:none;
}
.music-album-disc{
  width:170px;height:170px;border-radius:50%;overflow:hidden;
  border:4px solid #222;box-shadow:0 8px 30px rgba(0,0,0,.9), 0 0 25px rgba(29,185,84,.4);
  animation:spin 25s linear infinite;
}
.music-album-disc img{width:100%;height:100%;object-fit:cover;}
@keyframes spin { 100% { transform: rotate(360deg); } }

.yt-watch-info{padding:1rem;}
.yt-watch-title{font-size:1.05rem;font-weight:700;line-height:1.4;}
.yt-watch-views{font-size:.8rem;color:var(--muted);margin-top:4px;}

/* ── MUSIC CONTROLS PANEL FOR AUDIO MODES ── */
.music-controls-panel{
  background:#181818;border:1px solid #303030;border-radius:14px;
  padding:.9rem 1rem;margin:.8rem 0;display:none;flex-direction:column;gap:.7rem;
}
body.audio-mode .music-controls-panel { display: flex !important; }

.music-buttons-row{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:2px;}
.music-play-main-btn{
  background:var(--spotify-accent);color:#000;border:none;border-radius:24px;
  padding:.65rem 1.8rem;font-size:1.05rem;font-weight:800;cursor:pointer;
  box-shadow:0 3px 12px rgba(29,185,84,.4);
}
.music-play-main-btn:active{transform:scale(0.95);}

.yt-channel-row{display:flex;align-items:center;justify-content:space-between;margin:.5rem 0;padding:.5rem 0;}
.yt-chan-left{display:flex;align-items:center;gap:.7rem;}
.yt-sub-btn{background:#fff;color:#000;border:none;border-radius:18px;padding:.45rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;}

.yt-actions-scroll{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none;align-items:center;}
.yt-act-pill{
  background:var(--pill-bg);border:none;border-radius:18px;color:#fff;
  padding:.5rem 1rem;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.4rem;
  white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.yt-act-pill.dl-accent{background:var(--accent);font-weight:700;}
.yt-act-pill.love-pill-btn.is-loved{background:#ff2d55;color:#fff;font-weight:700;}

/* ── DOWNLOAD MODAL ── */
.dl-modal{
  position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);
  display:none;align-items:flex-end;justify-content:center;
}
.dl-sheet{
  width:100%;background:#212121;border-radius:16px 16px 0 0;
  padding:1.5rem;display:flex;flex-direction:column;gap:1rem;
}
.dl-option{
  background:#333;border:none;border-radius:12px;color:#fff;
  padding:1rem;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.18);backdrop-filter:blur(12px);
  color:#fff;padding:.6rem 1.2rem;border-radius:20px;font-size:.85rem;font-weight:600;
  z-index:9999;display:none;pointer-events:none;white-space:nowrap;
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- REAL HTML5 AUDIO STREAM TO ENGAGE ANDROID OS MEDIA ENGINE FOR SYSTEM NOTIFICATION DRAWER MEDIA CARD -->
<audio id="bgAudioKeeper" loop crossorigin="anonymous"></audio>

<div class="app" id="appRoot">
  <!-- TOP HEADER -->
  <div class="yt-header">
    <div class="yt-logo" id="headerLogo" onclick="switchTab('home')">
      <div class="yt-logo-icon"></div>
      <span id="headerTitle">YouTube</span>
    </div>
    <div class="yt-hdr-actions">
      <button class="yt-hdr-icon" onclick="focusSearch()">🔍</button>
      <button class="yt-hdr-icon" onclick="switchTab('favorites')" title="❤️ Loved Songs Playlist">
        ❤️ <span class="love-badge-count" id="loveCountBadge">0</span>
      </button>
    </div>
  </div>

  <!-- SEARCH BAR & LIVE AUTO-SUGGESTIONS -->
  <div class="yt-search-bar">
    <div class="yt-input-box">
      <span>🔍</span>
      <input type="text" id="searchInput"
        placeholder="Search YouTube..."
        oninput="handleSearchInput()"
        onkeydown="handleSearchKey(event)"
        onfocus="handleSearchInput()" />
      <button type="button" class="yt-clear-btn" id="clearBtn"
        onpointerdown="clearSearch(event)"
        onclick="clearSearch(event)">✕</button>
    </div>
    <button class="yt-search-btn" onclick="doSearch()">Search</button>

    <!-- LIVE SEARCH SUGGESTIONS DROPDOWN BOX -->
    <div class="search-suggestions-box" id="suggestionsBox"></div>
  </div>

  <!-- GENRE CHIPS BAR -->
  <div class="ytm-genre-bar" id="ytmGenreBar"></div>

  <!-- FEED -->
  <div class="yt-feed" id="videoFeed" onclick="hideSuggestions()">
    <div style="text-align:center;padding:3rem 1rem;color:#888;">
      Type any song or video name to search
    </div>
  </div>

  <!-- RESUME PLAYBACK BANNER (MOVED TO BOTTOM DIRECTLY ABOVE TAB NAV BAR) -->
  <div class="resume-banner" id="resumeBanner" onclick="resumeLastPlayed()">
    <span class="resume-banner-text" id="resumeBannerText">▶ Resume: Song Name (0:00)</span>
    <span class="resume-btn-chip">Resume</span>
  </div>

  <!-- FLOATING MINI MUSIC PLAYER BAR -->
  <div class="mini-player-bar" id="miniPlayerBar" onclick="maximizePlayer()">
    <div class="mini-player-info">
      <img src="" id="miniPlayerImg" class="mini-player-img"/>
      <div>
        <div class="mini-player-title" id="miniPlayerTitle">Song Title</div>
        <div class="mini-player-artist" id="miniPlayerArtist">Artist Name</div>
      </div>
    </div>
    <div class="mini-player-controls" onclick="event.stopPropagation()">
      <button class="mini-btn" id="miniPlayBtn" onclick="togglePlayPause()">⏸</button>
      <button class="mini-btn" onclick="closeWatch()">✕</button>
    </div>
  </div>

  <!-- BOTTOM NAV BAR (HOME, YT MUSIC, SPOTIFY, APPLE MUSIC, FAVORITES) -->
  <div class="yt-nav" id="mainNav">
    <div class="yt-nav-item active" id="navHome" onclick="switchTab('home')">
      <span class="yt-nav-icon">🏠</span>Home
    </div>
    <div class="yt-nav-item" id="navMusic" onclick="switchTab('music')">
      <span class="yt-nav-icon">🎵</span>YT Music
    </div>
    <div class="yt-nav-item" id="navSpotify" onclick="switchTab('spotify')">
      <span class="yt-nav-icon">💚</span>Spotify
    </div>
    <div class="yt-nav-item" id="navApple" onclick="switchTab('applemusic')">
      <span class="yt-nav-icon">🍎</span>Apple Music
    </div>
    <div class="yt-nav-item" id="navFavorites" onclick="switchTab('favorites')">
      <span class="yt-nav-icon">❤️</span>Favorites
    </div>
  </div>
</div>

<!-- GUARANTEED WORKING UNIFIED PLAYER SCREEN WITH 100% ORIGINAL YOUTUBE CONTROLS -->
<div class="yt-watch-screen" id="watchScreen">
  <div class="yt-watch-topbar">
    <button class="yt-back-btn" onclick="handleBackFromWatch()">← Back</button>
    <div style="font-weight:700;font-size:.9rem;" id="nowPlayingText">Now Playing</div>
    <div style="display:flex;gap:.6rem;align-items:center;">

      <span id="musicCurTime">0:00</span>
      <span id="musicDurTime">0:00</span>

    <div class="music-controls-panel">

      <div class="yt-chan-left">

        <div>
          <div style="font-weight:600;font-size:.9rem;" id="wChannel">Artist Name</div>
          <div style="font-size:.75rem;color:#aaa;" id="wBadge">Spotify MP3</div>
        </div>
      </div>

    </div>

      <button class="yt-act-pill love-pill-btn" id="watchLovePill" onclick="toggleCurrentLove()">❤️ Love Song</button>

<!-- DOWNLOAD SHEET -->
<div class="dl-modal" id="dlModal" onclick="closeDlModal()">
  <div class="dl-sheet" onclick="event.stopPropagation()">
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:.5rem;">Download Format</div>
    <button class="dl-option" onclick="triggerDownload('mp3')">
      🎵 Audio Only (MP3 Song) <span>⬇</span>

      🎬 Video (MP4 Video) <span>⬇</span>

    <button style="background:none;border:none;color:#aaa;padding:.5rem;cursor:pointer;font-size:.95rem;" onclick="closeDlModal()">Cancel</button>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API = 'https://aura-music-player-rj2v.onrender.com';
let ytPlayer = null;
let currentVideo = null;
let backPressCount = 0;
let currentMode = 'youtube'; // 'youtube', 'ytmusic', 'spotify', 'applemusic', 'favorites'
let searchAbortController = null;
let suggestDebounceTimer = null;
let seekTimer = null;
let isUserPaused = false;
let zoomScale = 1.0;
let audioCtx = null;

// CLIENT SIDE SEARCH CACHE (INSTANT 0ms RESPONSES)
const clientSearchCache = new Map();

// ── LIVE SEARCH AUTO-SUGGESTIONS SYSTEM ──
function handleSearchInput() {
  toggleClearBtn();
  const q = document.getElementById('searchInput').value.trim();
  const box = document.getElementById('suggestionsBox');

  if (!q || q.length < 2) {
    box.style.display = 'none';
    return;
  }

  clearTimeout(suggestDebounceTimer);
  suggestDebounceTimer = setTimeout(async () => {
    try {
      const r = await fetch(`${API}/api/suggestions?q=${encodeURIComponent(q)}`);
      const d = await r.json();
      if (d.suggestions && d.suggestions.length > 0) {
        box.innerHTML = d.suggestions.slice(0, 7).map(item => `
          <div class="suggestion-item" onclick="selectSuggestion('${escHtml(item)}')">
            <span>🔍</span> ${item}
          </div>
        `).join('');
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    } catch(e) {
      box.style.display = 'none';
    }
  }, 150);
}

function selectSuggestion(queryStr) {
  const si = document.getElementById('searchInput');
  si.value = queryStr;
  hideSuggestions();
  doSearch();
}

function hideSuggestions() {
  const box = document.getElementById('suggestionsBox');
  if (box) box.style.display = 'none';
}

// ── FULL NATIVE ANDROID SYSTEM NOTIFICATION SHADE & LOCK SCREEN MEDIA CARD ──
function setupMediaSession() {
  if (!('mediaSession' in navigator) || !currentVideo) return;
  try {
    const thumbUrl = currentVideo.thumb || currentVideo.thumbnail || '';
    
    navigator.mediaSession.metadata = new MediaMetadata({
      title: currentVideo.title || 'Aura Music Track',
      artist: currentVideo.artist || 'Aura Music Player',
      album: 'Aura Music',
      artwork: [
        { src: thumbUrl, sizes: '96x96', type: 'image/jpeg' },
        { src: thumbUrl, sizes: '128x128', type: 'image/jpeg' },
        { src: thumbUrl, sizes: '192x192', type: 'image/jpeg' },
        { src: thumbUrl, sizes: '256x256', type: 'image/jpeg' },
        { src: thumbUrl, sizes: '384x384', type: 'image/jpeg' },
        { src: thumbUrl, sizes: '512x512', type: 'image/jpeg' }
      ]
    });

    navigator.mediaSession.playbackState = 'playing';

    navigator.mediaSession.setActionHandler('play', () => { isUserPaused = false; togglePlayPause(); });
    navigator.mediaSession.setActionHandler('pause', () => { isUserPaused = true; togglePlayPause(); });
    navigator.mediaSession.setActionHandler('seekbackward', () => { skipTrack(-10); });
    navigator.mediaSession.setActionHandler('seekforward', () => { skipTrack(10); });
    
    if ('setActionHandler' in navigator.mediaSession) {
      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime && ytPlayer && ytPlayer.seekTo) {
            ytPlayer.seekTo(details.seekTime, true);
          }
        });
      } catch(e){}
    }
  } catch(e){}
}

function updateMediaSessionPosition() {
  if (!('mediaSession' in navigator) || !ytPlayer) return;
  try {
    if ('setPositionState' in navigator.mediaSession && ytPlayer.getDuration && ytPlayer.getCurrentTime) {
      const duration = ytPlayer.getDuration() || 1;
      const position = ytPlayer.getCurrentTime() || 0;
      navigator.mediaSession.setPositionState({
        duration: Math.max(duration, 1),
        playbackRate: 1,
        position: Math.min(position, duration)
      });
    }
  } catch(e){}
}

function startBgAudioKeeper() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const dst = audioCtx.createMediaStreamDestination();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.001; // Force Android OS Media Notification Card
      osc.connect(gain);
      gain.connect(dst);
      osc.start();

      const bgAudio = document.getElementById('bgAudioKeeper');
      if (bgAudio) {
        bgAudio.srcObject = dst.stream;
        bgAudio.play().catch(e => {});
      }
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  } catch(e){}
}

// CONTINUOUS BACKGROUND HEARTBEAT TO ENSURE YOUTUBE PLAYER NEVER STOPS ON LOCK SCREEN OR APP SWITCHING
setInterval(() => {
  if (currentVideo && !isUserPaused && ytPlayer && ytPlayer.getPlayerState) {
    try {
      const st = ytPlayer.getPlayerState();
      if (st === YT.PlayerState.PAUSED) {
        console.log('[Lock Screen / App Switch Heartbeat]: Re-playing video!');
        ytPlayer.playVideo();
      }
    } catch(e){}
  }
}, 1000);

// ── SAVE PLAYBACK POSITION & AUTO-RESUME ("WHERE I LEFT OFF") ──
function savePlaybackPosition() {
  if (!currentVideo || !ytPlayer || !ytPlayer.getCurrentTime) return;
  try {
    const curTime = ytPlayer.getCurrentTime() || 0;
    if (curTime > 5) {
      const data = {
        video: currentVideo,
        time: curTime,
        mode: currentMode,
        timestamp: Date.now()
      };
      localStorage.setItem('aura_last_played', JSON.stringify(data));
      checkResumeBanner();
    }
  } catch(e){}
}

function checkResumeBanner() {
  try {
    const raw = localStorage.getItem('aura_last_played');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.video && data.time > 5) {
      const banner = document.getElementById('resumeBanner');
      const text = document.getElementById('resumeBannerText');
      if (banner && text) {
        text.textContent = `▶ Resume: ${data.video.title} (${fmtSec(data.time)})`;
        banner.style.display = 'flex';
      }
    }
  } catch(e){}
}

function resumeLastPlayed() {
  try {
    const raw = localStorage.getItem('aura_last_played');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.video) {
      if (data.mode) currentMode = data.mode;
      openWatch(data.video.id, data.video.title, data.video.artist, data.video.thumb || data.video.thumbnail);
      setTimeout(() => {
        if (ytPlayer && ytPlayer.seekTo) {
          ytPlayer.seekTo(data.time, true);
          showToast(`Resumed from ${fmtSec(data.time)}`);
        }
      }, 800);
      document.getElementById('resumeBanner').style.display = 'none';
    }
  } catch(e){}
}

// ── FAVORITES / LOVED SONGS PLAYLIST SYSTEM ──
let lovedSongs = [];

function loadLovedSongs() {
  try {
    const data = localStorage.getItem('aura_favorites');
    if (data) lovedSongs = JSON.parse(data);
  } catch(e){ lovedSongs = []; }
  updateLoveBadgeCount();
}

function saveLovedSongs() {
  try {
    localStorage.setItem('aura_favorites', JSON.stringify(lovedSongs));
  } catch(e){}
  updateLoveBadgeCount();
}

function updateLoveBadgeCount() {
  const badge = document.getElementById('loveCountBadge');
  if (badge) badge.textContent = lovedSongs.length;
}

function isSongLoved(id) {
  return lovedSongs.some(s => s.id === id);
}

function toggleLoveSong(songObj, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  
  const index = lovedSongs.findIndex(s => s.id === songObj.id);
  if (index > -1) {
    lovedSongs.splice(index, 1);
    showToast('Removed from ❤️ Favorites');
  } else {
    lovedSongs.unshift({
      id: songObj.id,
      title: songObj.title,
      artist: songObj.artist,
      thumbnail: songObj.thumbnail || songObj.thumb,
      duration: songObj.duration || 0,
      mode: currentMode
    });
    showToast('Added to ❤️ Favorites Playlist!');
  }
  saveLovedSongs();

  // Update UI heart icons
  updateCurrentLoveUI();
  if (currentMode === 'favorites') {
    renderFavoritesFeed();
  } else {
    // Refresh card heart if in feed
    const cardHeart = document.getElementById(`heart-${songObj.id}`);
    if (cardHeart) {
      if (isSongLoved(songObj.id)) cardHeart.classList.add('is-loved');
      else cardHeart.classList.remove('is-loved');
    }
  }
}

function toggleCurrentLove() {
  if (!currentVideo) return;
  toggleLoveSong(currentVideo);
}

function updateCurrentLoveUI() {
  if (!currentVideo) return;
  const isLoved = isSongLoved(currentVideo.id);
  const btn = document.getElementById('watchLoveBtn');
  const pill = document.getElementById('watchLovePill');

  if (btn) {
    btn.textContent = isLoved ? '❤️' : '♡';
  }
  if (pill) {
    if (isLoved) {
      pill.textContent = '❤️ Loved Song';
      pill.classList.add('is-loved');
    } else {
      pill.textContent = '♡ Add to Favorites';
      pill.classList.remove('is-loved');
    }
  }
}

// ── SCREEN ZOOM SYSTEM FOR YOUTUBE PLAYER (WORKS IN PORTRAIT & LANDSCAPE) ──
function applyZoom(scaleVal) {
  zoomScale = Math.min(Math.max(scaleVal, 1.0), 3.0);
  const wrapper = document.getElementById('zoomWrapper');
  if (wrapper) {
    wrapper.style.transform = `scale(${zoomScale})`;
  }
  const pct = Math.round(zoomScale * 100);
  const lbl = document.getElementById('playerZoomLabel');
  if (lbl) lbl.textContent = `${pct}%`;
  showToast(`Screen Zoom: ${pct}%`);
}

function cycleZoomLevel(e) {
  if (e) e.stopPropagation();
  if (zoomScale < 1.15) applyZoom(1.25);
  else if (zoomScale < 1.4) applyZoom(1.50);
  else if (zoomScale < 1.8) applyZoom(2.00);
  else applyZoom(1.0);
}

document.addEventListener('DOMContentLoaded', () => {
  loadLovedSongs();
  checkResumeBanner();
});

// ── YOUTUBE PLAYER INIT WITH 100% ORIGINAL YOUTUBE CONTROLS ──
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytPlayerContainer', {
    height: '100%', width: '100%',
    playerVars: {
      autoplay: 1, controls: 1, rel: 0, playsinline: 1, enablejsapi: 1, fs: 1,
      modestbranding: 0, cc_load_policy: 1, iv_load_policy: 1
    },
    events: {
      'onStateChange': onPlayerStateChange,
      'onError': onPlayerError
    }
  });
}

// ── FAIL-SAFE PLAYBACK FALLBACK ──
async function onPlayerError(e) {
  console.log('[Player Error]:', e.data);
  if (!currentVideo) return;
  showToast('Connecting audio stream fallback...');
  try {
    const q = `${currentVideo.title} ${currentVideo.artist} official audio`;
    const r = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
    const d = await r.json();
    if (d.results && d.results.length > 0) {
      const fallbackTrack = d.results[0];
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(fallbackTrack.id);
        setTimeout(() => { if (ytPlayer.playVideo) ytPlayer.playVideo(); }, 200);
      }
    }
  } catch(err) {
    showToast('Unable to play stream');
  }
}

function onPlayerStateChange(e) {
  const btn = document.getElementById('musicMainPlayBtn');
  const miniBtn = document.getElementById('miniPlayBtn');

  if (e.data === YT.PlayerState.PLAYING) {
    if (btn) btn.textContent = '⏸ Pause';
    if (miniBtn) miniBtn.textContent = '⏸';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    startSeekTimer();
    startBgAudioKeeper();
    setupMediaSession();
  } else if (e.data === YT.PlayerState.PAUSED) {
    // IF PAUSED BY LOCK SCREEN OR MINIMIZE SYSTEM AND NOT EXPLICIT USER PAUSE, AUTO-RESUME IMMEDIATELY!
    if (!isUserPaused && currentVideo) {
      console.log('[System Pause Intercepted]: Resuming playback!');
      setTimeout(() => {
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      }, 50);
    } else {
      if (btn) btn.textContent = '▶ Play';
      if (miniBtn) miniBtn.textContent = '▶';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      stopSeekTimer();
    }
  }
}

function startSeekTimer() {
  stopSeekTimer();
  seekTimer = setInterval(() => {
    if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
      const cur = ytPlayer.getCurrentTime() || 0;
      const dur = ytPlayer.getDuration() || 1;
      const pct = (cur / dur) * 100;
      document.getElementById('musicSeekSlider').value = pct;
      document.getElementById('musicCurTime').textContent = fmtSec(cur);
      document.getElementById('musicDurTime').textContent = fmtSec(dur);
      savePlaybackPosition();
      updateMediaSessionPosition();
    }
  }, 1000);
}

function stopSeekTimer() {
  if (seekTimer) clearInterval(seekTimer);
}

function togglePlayPause() {
  if (!ytPlayer || !ytPlayer.getPlayerState) return;
  const state = ytPlayer.getPlayerState();
  if (state === YT.PlayerState.PLAYING) {
    isUserPaused = true;
    ytPlayer.pauseVideo();
  } else {
    isUserPaused = false;
    ytPlayer.playVideo();
  }
}

function seekTrack(val) {
  if (ytPlayer && ytPlayer.getDuration) {
    const dur = ytPlayer.getDuration() || 0;
    ytPlayer.seekTo((val / 100) * dur, true);
    savePlaybackPosition();
  }
}

function skipTrack(sec) {
  if (ytPlayer && ytPlayer.getCurrentTime) {
    const cur = ytPlayer.getCurrentTime() || 0;
    ytPlayer.seekTo(cur + sec, true);
    savePlaybackPosition();
  }
}

// ── SEARCH INPUT HANDLING ──
function focusSearch() {
  document.getElementById('searchInput').focus();
}

function toggleClearBtn() {
  const input = document.getElementById('searchInput');
  document.getElementById('clearBtn').style.display = input.value.length > 0 ? 'inline-block' : 'none';
}

function clearSearch(e) {
  if (e) {
    try { e.preventDefault(); e.stopPropagation(); } catch(err){}
  }
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('clearBtn').style.display = 'none';
  hideSuggestions();
  
  input.blur();
  if (document.activeElement) document.activeElement.blur();
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    e.target.blur();
    hideSuggestions();
    doSearch();
  }
}

function dismissKeyboard() {}

function searchGenre(genreQuery) {
  const si = document.getElementById('searchInput');
  si.value = genreQuery;
  toggleClearBtn();
  hideSuggestions();
  doSearch();
}

// ── LIGHTNING FAST SEARCH WITH CLIENT CACHE (0ms SPEED) ──
async function doSearch() {
  hideSuggestions();
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  const cacheKey = `${currentMode}:${q.toLowerCase()}`;
  if (clientSearchCache.has(cacheKey)) {
    console.log('[Client Cache Hit - 0ms]');
    renderFeed(clientSearchCache.get(cacheKey));
    return;
  }

  if (searchAbortController) {
    try { searchAbortController.abort(); } catch(err){}
  }
  searchAbortController = new AbortController();

  const feed = document.getElementById('videoFeed');
  
  let endpoint = `${API}/api/search/youtube`;
  let label = '⚡ Searching YouTube...';

  if (currentMode === 'ytmusic') {
    endpoint = `${API}/api/search/ytmusic`;
    label = '⚡ Pulling MP3 songs from YouTube Music...';
  } else if (currentMode === 'spotify') {
    endpoint = `${API}/api/search/spotify`;
    label = '⚡ Pulling MP3 songs from Spotify...';
  } else if (currentMode === 'applemusic') {
    endpoint = `${API}/api/search/applemusic`;
    label = '⚡ Pulling MP3 songs from Apple Music...';
  }

  feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">${label}</div>`;

  try {
    const timeoutId = setTimeout(() => searchAbortController.abort(), 4500);
    const r = await fetch(`${endpoint}?q=${encodeURIComponent(q)}`, { signal: searchAbortController.signal });
    clearTimeout(timeoutId);
    
    if (!r.ok) {
      const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
      const fallbackData = await fallbackR.json();
      clientSearchCache.set(cacheKey, fallbackData.results || []);
      renderFeed(fallbackData.results || []);
      return;
    }
    
    const data = await r.json();
    if (data.results && data.results.length > 0) {
      clientSearchCache.set(cacheKey, data.results);
      renderFeed(data.results);
    } else {
      const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
      const fallbackData = await fallbackR.json();
      clientSearchCache.set(cacheKey, fallbackData.results || []);
      renderFeed(fallbackData.results || []);
    }
  } catch(e) {
    if (e.name === 'AbortError') {
      try {
        const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
        const fallbackData = await fallbackR.json();
        clientSearchCache.set(cacheKey, fallbackData.results || []);
        renderFeed(fallbackData.results || []);
      } catch(err2) {
        feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">Search reset. <br/><br/><button style="background:#333;color:#fff;border:none;padding:.5rem 1rem;border-radius:16px;" onclick="doSearch()">Retry</button></div>`;
      }
    } else {
      try {
        const fallbackR = await fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`);
        const fallbackData = await fallbackR.json();
        clientSearchCache.set(cacheKey, fallbackData.results || []);
        renderFeed(fallbackData.results || []);
      } catch(err2) {
        feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">No results found. <br/><br/><button style="background:#333;color:#fff;border:none;padding:.5rem 1rem;border-radius:16px;" onclick="doSearch()">Retry</button></div>`;
      }
    }
  }
}

function renderFeed(list) {
  const feed = document.getElementById('videoFeed');
  if (!list || !list.length) {
    feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">No results found</div>`;
    return;
  }

  feed.innerHTML = list.map(item => {
    let badgeHtml = '';
    if (currentMode === 'ytmusic') badgeHtml = '<div class="ytm-badge">🎵 YT Music MP3</div>';
    else if (currentMode === 'spotify') badgeHtml = '<div class="spotify-badge">💚 Spotify MP3</div>';
    else if (currentMode === 'applemusic') badgeHtml = '<div class="applemusic-badge">🍎 Apple Music MP3</div>';

    let subtext = item.artist;
    if (currentMode === 'spotify') subtext = `Spotify Audio MP3 · ${item.artist}`;
    else if (currentMode === 'applemusic') subtext = `Apple Music Audio MP3 · ${item.artist}`;
    else if (currentMode === 'ytmusic') subtext = `YouTube Music MP3 · ${item.artist}`;

    const isLoved = isSongLoved(item.id);
    const itemJson = JSON.stringify({id:item.id, title:item.title, artist:item.artist, thumbnail:item.thumbnail, duration:item.duration}).replace(/"/g, '&quot;');

    return `
    <div class="yt-card" onclick="openWatch('${item.id}','${escHtml(item.title)}','${escHtml(item.artist)}','${item.thumbnail}')">
      <div class="yt-thumb-wrap">
        <img src="${item.thumbnail}" loading="lazy"/>
        <div class="yt-dur">${fmtSec(item.duration)}</div>
        ${badgeHtml}
        <button class="card-love-btn ${isLoved ? 'is-loved' : ''}" id="heart-${item.id}" onclick="toggleLoveSong(${itemJson}, event)">
          ${isLoved ? '❤️' : '♡'}
        </button>
      </div>
      <div class="yt-details">
        <div class="yt-avatar">${(item.artist||'S')[0].toUpperCase()}</div>
        <div class="yt-meta">
          <div class="yt-title">${item.title}</div>
          <div class="yt-subtext">${subtext}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderFavoritesFeed() {
  const feed = document.getElementById('videoFeed');
  if (!lovedSongs || !lovedSongs.length) {
    feed.innerHTML = `
      <div style="text-align:center;padding:4rem 1rem;color:#aaa;">
        <div style="font-size:3rem;margin-bottom:10px;">❤️</div>
        <div style="font-size:1.1rem;font-weight:700;color:#fff;">No Loved Songs Yet</div>
        <div style="font-size:.85rem;margin-top:6px;color:#888;">Tap the ❤️ heart icon on any video or song to save it to your Favorites playlist!</div>
      </div>`;
    return;
  }

  feed.innerHTML = `
    <div style="padding:1rem 1rem .5rem;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;">
      <span>❤️ Loved Songs Playlist (${lovedSongs.length})</span>
      <button style="background:none;border:none;color:#ff2d55;font-weight:700;font-size:.85rem;" onclick="lovedSongs=[];saveLovedSongs();renderFavoritesFeed();">Clear All</button>
    </div>
    ${lovedSongs.map(item => {
      const itemJson = JSON.stringify({id:item.id, title:item.title, artist:item.artist, thumbnail:item.thumbnail, duration:item.duration}).replace(/"/g, '&quot;');
      return `
      <div class="yt-card" onclick="openWatch('${item.id}','${escHtml(item.title)}','${escHtml(item.artist)}','${item.thumbnail}')">
        <div class="yt-thumb-wrap">
          <img src="${item.thumbnail}" loading="lazy"/>
          <div class="yt-dur">${fmtSec(item.duration)}</div>
          <div class="spotify-badge" style="background:#ff2d55;color:#fff;">❤️ Loved Song</div>
          <button class="card-love-btn is-loved" onclick="toggleLoveSong(${itemJson}, event)">❤️</button>
        </div>
        <div class="yt-details">
          <div class="yt-avatar" style="background:#ff2d55;">❤️</div>
          <div class="yt-meta">
            <div class="yt-title">${item.title}</div>
            <div class="yt-subtext">Favorites Playlist · ${item.artist}</div>
          </div>
        </div>
      </div>`;
    }).join('')}`;
}

// ── PLAY PLAYER SCREEN & MINI PLAYER BAR ──
function openWatch(id, title, artist, thumb) {
  currentVideo = { id, title, artist, thumb };
  isUserPaused = false;
  document.getElementById('wTitle').textContent = title;
  document.getElementById('wChannel').textContent = artist;
  document.getElementById('wAvatar').textContent = (artist||'S')[0].toUpperCase();

  // Update Mini Player Bar
  document.getElementById('miniPlayerImg').src = thumb;
  document.getElementById('miniPlayerTitle').textContent = title;
  document.getElementById('miniPlayerArtist').textContent = artist;

  const overlay = document.getElementById('musicAlbumOverlay');
  const overlayImg = document.getElementById('musicAlbumImg');
  const overlayBadge = document.getElementById('musicOverlayBadge');
  const playBtn = document.getElementById('musicMainPlayBtn');
  overlayImg.src = thumb;

  let modeBadge = 'YouTube';
  let accentColor = 'var(--spotify-accent)';

  if (currentMode === 'spotify' || currentMode === 'applemusic' || currentMode === 'ytmusic') {
    document.body.classList.add('audio-mode');
  } else {
    document.body.classList.remove('audio-mode');
  }

  if (currentMode === 'spotify') {
    modeBadge = 'Spotify MP3 Audio';
    accentColor = 'var(--spotify-accent)';
    overlay.style.display = 'flex';
    overlayBadge.textContent = '💚 Spotify Audio Player';
    overlayBadge.style.color = accentColor;
  } else if (currentMode === 'applemusic') {
    modeBadge = 'Apple Music MP3 Audio';
    accentColor = 'var(--applemusic-accent)';
    overlay.style.display = 'flex';
    overlayBadge.textContent = '🍎 Apple Music Audio Player';
    overlayBadge.style.color = accentColor;
  } else {
    overlay.style.display = 'none';
    if (currentMode === 'ytmusic') {
      modeBadge = 'YouTube Music MP3';
      accentColor = 'var(--ytmusic-accent)';
    } else {
      accentColor = 'var(--accent)';
    }
  }

  document.getElementById('musicSeekSlider').style.accentColor = accentColor;
  playBtn.style.background = accentColor;
  document.getElementById('miniPlayerArtist').style.color = accentColor;

  document.getElementById('wBadge').textContent = modeBadge;
  document.getElementById('nowPlayingText').textContent = `🎵 ${modeBadge}`;

  updateCurrentLoveUI();
  setupMediaSession();
  startBgAudioKeeper();

  // DISMISS KEYBOARD & SCROLL WATCH SCREEN TO TOP
  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  const ws = document.getElementById('watchScreen');
  ws.scrollTop = 0;
  ws.classList.remove('is-minimized');
  ws.style.display = 'flex';
  document.getElementById('miniPlayerBar').style.display = 'none';
  document.body.classList.add('has-open-player');

  // RESET ZOOM SCALE AT START
  applyZoom(1.0);

  // GRACEFULLY STOP PREVIOUS VIDEO BEFORE LOADING NEW ONE
  stopSeekTimer();
  if (ytPlayer) {
    if (ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch(e){} }
    
    setTimeout(() => {
      if (ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(id);
      }
      setTimeout(() => {
        if (ytPlayer.playVideo) ytPlayer.playVideo();
      }, 100);
    }, 50);
  }

  checkAutoOrientation();
}

// ── 100% NON-STOP CONTINUOUS BACKGROUND PLAYBACK ON MINIMIZE / GOING BACK ──
function minimizePlayer(e) {
  if (e) e.stopPropagation();
  document.activeElement && document.activeElement.blur();

  if (document.fullscreenElement || document.webkitFullscreenElement) {
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e){}
  }

  // USE OFF-SCREEN POSITIONAL MINIMIZE SO CHROMIUM WEBVIEW NEVER PAUSES THE VIDEO OR MUSIC!
  const ws = document.getElementById('watchScreen');
  ws.classList.add('is-minimized');
  document.body.classList.remove('has-open-player');
  document.body.classList.remove('is-landscape');

  if (currentVideo) {
    document.getElementById('miniPlayerBar').style.display = 'flex';
  }
}

function maximizePlayer() {
  const ws = document.getElementById('watchScreen');
  ws.scrollTop = 0;
  ws.classList.remove('is-minimized');
  ws.style.display = 'flex';
  document.body.classList.add('has-open-player');
  document.getElementById('miniPlayerBar').style.display = 'none';
  checkAutoOrientation();
}

function toggleOverlayView() {
  const overlay = document.getElementById('musicAlbumOverlay');
  if (overlay.style.display === 'flex') {
    overlay.style.display = 'none';
  } else {
    overlay.style.display = 'flex';
  }
}

function handleBackFromWatch() {
  minimizePlayer();
}

function closeWatch() {
  document.activeElement && document.activeElement.blur();

  if (document.fullscreenElement || document.webkitFullscreenElement) {
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e){}
  }

  const ws = document.getElementById('watchScreen');
  ws.classList.remove('is-minimized');
  ws.style.display = 'none';
  ws.classList.remove('is-fullscreen');
  document.body.classList.remove('is-landscape');
  document.body.classList.remove('has-open-player');
  document.getElementById('mainNav').style.display = 'flex';
  document.getElementById('miniPlayerBar').style.display = 'none';
  currentVideo = null;
  isUserPaused = true;
  if (ytPlayer && ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch(e){} }
  stopSeekTimer();

  document.getElementById('searchInput').blur();
}

function toggleFullscreen() {
  const pBox = document.getElementById('playerBox');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e){}
  } else {
    try {
      if (pBox.requestFullscreen) pBox.requestFullscreen();
      else if (pBox.webkitRequestFullscreen) pBox.webkitRequestFullscreen();
    } catch(e){}
  }
}

// ── DOWNLOAD ──
function openDlModal() {
  if (!currentVideo) { showToast('Open a track first'); return; }
  document.getElementById('dlModal').style.display = 'flex';
}
function closeDlModal() {
  document.getElementById('dlModal').style.display = 'none';
}

function triggerDownload(format) {
  if (!currentVideo) return;
  closeDlModal();
  showToast(`Opening ${format.toUpperCase()} Downloader...`);

  const dlUrl = `https://y2mate.is/en/youtube-to-mp3/${currentVideo.id}`;

  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
      window.Capacitor.Plugins.Browser.open({ url: dlUrl });
    } else {
      window.open(dlUrl, '_system');
    }
  } catch(e) {
    window.open(dlUrl, '_system');
  }
}

// ── TOAST ──
function showToast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// ── TAB SWITCHING (KEEP MUSIC PLAYING WHILE SWITCHING TABS OR SEARCHING!) ──
function switchTab(tab) {
  document.querySelectorAll('.yt-nav-item').forEach(el => el.classList.remove('active'));
  const feed = document.getElementById('videoFeed');
  const si = document.getElementById('searchInput');
  const logo = document.getElementById('headerLogo');
  const title = document.getElementById('headerTitle');
  const genreBar = document.getElementById('ytmGenreBar');

  logo.className = 'yt-logo';
  hideSuggestions();

  if (tab === 'home') {
    currentMode = 'youtube';
    document.body.classList.remove('audio-mode');
    title.textContent = 'YouTube';
    si.placeholder = 'Search YouTube videos & music...';
    genreBar.style.display = 'none';
    document.getElementById('navHome').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">Type any song or video name to search</div>`;
  } else if (tab === 'music') {
    currentMode = 'ytmusic';
    document.body.classList.add('audio-mode');
    logo.classList.add('ytmusic');
    title.textContent = 'YouTube Music';
    si.placeholder = 'Search YouTube Music songs...';
    genreBar.style.display = 'flex';
    genreBar.innerHTML = `
      <div class="ytm-genre-chip" onclick="searchGenre('Trending Songs 2026')">🔥 Trending MP3</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Top Audio Songs')">🎤 Top Songs</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Romantic Love Songs')">❤️ Romantic MP3</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Punjabi Beats')">💃 Punjabi Beats</div>
    `;
    document.getElementById('navMusic').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">🎵 Search any song from YouTube Music or tap a category above</div>`;
  } else if (tab === 'spotify') {
    currentMode = 'spotify';
    document.body.classList.add('audio-mode');
    logo.classList.add('spotify');
    title.textContent = 'Spotify Hits';
    si.placeholder = 'Search Spotify MP3 songs...';
    genreBar.style.display = 'flex';
    genreBar.innerHTML = `
      <div class="ytm-genre-chip" onclick="searchGenre('Global Top Hits 2026')">🔥 Global Hits</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Trending Audio Songs')">🎤 Trending Audio</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Pop Favorites')">🎸 Pop Hits</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Chill Beats Audio')">☕ Chill Beats</div>
    `;
    document.getElementById('navSpotify').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">💚 Search any song from Spotify MP3 or tap a category above</div>`;
  } else if (tab === 'applemusic') {
    currentMode = 'applemusic';
    document.body.classList.add('audio-mode');
    logo.classList.add('applemusic');
    title.textContent = 'Apple Music';
    si.placeholder = 'Search Apple Music songs...';
    genreBar.style.display = 'flex';
    genreBar.innerHTML = `
      <div class="ytm-genre-chip" onclick="searchGenre('Top 100 Audio Charts')">🍎 Top 100 Charts</div>
      <div class="ytm-genre-chip" onclick="searchGenre('New Release Songs')">🎵 New Releases</div>
      <div class="ytm-genre-chip" onclick="searchGenre('Global Chart Hits')">⚡ Global Hits</div>
    `;
    document.getElementById('navApple').classList.add('active');
    si.value = '';
    toggleClearBtn();
    feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">🍎 Search any song from Apple Music MP3 or tap a category above</div>`;
  } else if (tab === 'favorites') {
    currentMode = 'favorites';
    document.body.classList.remove('audio-mode');
    logo.classList.add('favorites');
    title.textContent = '❤️ Loved Playlist';
    si.placeholder = 'Search inside your favorites...';
    genreBar.style.display = 'none';
    document.getElementById('navFavorites').classList.add('active');
    si.value = '';
    toggleClearBtn();
    renderFavoritesFeed();
  }
}

// ── HARDWARE BACK BUTTON (FAIL-PROOF SAFE BACK) ──
function handleHardwareBack() {
  const dlModal = document.getElementById('dlModal');
  const ws = document.getElementById('watchScreen');
  const si = document.getElementById('searchInput');

  document.activeElement && document.activeElement.blur();
  hideSuggestions();

  if (dlModal.style.display === 'flex') { closeDlModal(); return true; }
  if (ws.classList.contains('is-fullscreen')) {
    ws.classList.remove('is-fullscreen');
    document.getElementById('mainNav').style.display = 'flex';
    return true;
  }
  if (ws.style.display === 'flex' && !ws.classList.contains('is-minimized')) {
    minimizePlayer();
    return true;
  }

  if (si.value.length > 0) {
    clearSearch();
    return true;
  }

  backPressCount++;
  if (backPressCount === 1) {
    showToast('Press back again to exit');
    setTimeout(() => { backPressCount = 0; }, 2000);
    return true;
  } else if (backPressCount >= 2) {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)
      window.Capacitor.Plugins.App.exitApp();
  }
  return false;
}

// ── AUTOMATIC FULLSCREEN LANDSCAPE ORIENTATION FOR MOBILE ──
function checkAutoOrientation() {
  const ws = document.getElementById('watchScreen');
  const pBox = document.getElementById('playerBox');
  const nav = document.getElementById('mainNav');
  const isLandscape = window.innerWidth > window.innerHeight;

  if (isLandscape && (ws.style.display === 'flex' || document.body.classList.contains('has-open-player'))) {
    document.body.classList.add('is-landscape');
    document.body.classList.add('has-open-player');
    nav.style.display = 'none';

    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      try {
        if (pBox.requestFullscreen) pBox.requestFullscreen().catch(e=>{});
        else if (pBox.webkitRequestFullscreen) pBox.webkitRequestFullscreen();
      } catch(e){}
    }

    if (ytPlayer && ytPlayer.setSize) {
      try { ytPlayer.setSize(window.innerWidth, window.innerHeight); } catch(e){}
    }

    applyZoom(zoomScale);
  } else {
    document.body.classList.remove('is-landscape');
    if (ws && ws.style.display === 'flex' && !ws.classList.contains('is-fullscreen')) {
      nav.style.display = 'flex';
    }
    applyZoom(zoomScale);
  }
}

window.addEventListener('resize', checkAutoOrientation);
window.addEventListener('orientationchange', checkAutoOrientation);

// ── PREVENT CHROME REDIRECTS ──
window.open = function(url, target) {
  if (target === '_system' && url) {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return null;
  }
  return null;
};
document.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (a && a.href && (a.href.includes('youtube.com') || a.href.includes('youtu.be'))) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, true);

// ── CAPACITOR BACK BUTTON ──
document.addEventListener('DOMContentLoaded', () => {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('backButton', handleHardwareBack);
  }
});

// ── HELPERS ──
function escHtml(str) {
  return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function fmtSec(sec) {
  if (!sec) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
