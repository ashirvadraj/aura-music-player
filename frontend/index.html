<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>YouTube</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--surface:#212121;--border:#383838;
  --text:#f1f1f1;--muted:#aaa;--accent:#ff0000;
  --ytmusic-accent:#ff0033;
  --pill-bg:rgba(255,255,255,.1);
  --safe-top: max(32px, env(safe-area-inset-top));
}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);user-select:none;}

.app{height:100%;width:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);}

/* ── TOP HEADER ── */
.yt-header{
  height:calc(52px + var(--safe-top));
  padding-top:var(--safe-top);
  padding-left:1rem;padding-right:1rem;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;z-index:10;
}
.yt-logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;letter-spacing:-.5px;cursor:pointer;}
.yt-logo-icon{width:30px;height:22px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
.yt-logo-icon::after{content:'';border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent #fff;margin-left:2px;}
.yt-logo.ytmusic .yt-logo-icon{background:var(--ytmusic-accent);border-radius:50%;width:26px;height:26px;}
.yt-logo.ytmusic .yt-logo-icon::after{border-width:4px 0 4px 7px;}

.yt-hdr-actions{display:flex;align-items:center;gap:1.2rem;}
.yt-hdr-icon{font-size:1.2rem;cursor:pointer;color:var(--text);background:none;border:none;}

/* ── SEARCH BAR ── */
.yt-search-bar{
  padding:.6rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;gap:.5rem;align-items:center;flex-shrink:0;z-index:20;
}
.yt-input-box{
  flex:1;background:#121212;border:1px solid #303030;border-radius:20px;
  padding:.4rem.8rem;display:flex;align-items:center;gap:.6rem;position:relative;
}
.yt-input-box input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:.95rem;}
.yt-clear-btn{
  background:none;border:none;color:var(--muted);font-size:1.2rem;
  cursor:pointer;display:none;padding:.2rem .6rem;z-index:50;
  touch-action:manipulation;-webkit-user-select:none;
}
.yt-clear-btn:active{color:#fff;transform:scale(1.2);}
.yt-search-btn{background:#222;border:1px solid #303030;border-radius:20px;color:#fff;padding:.45rem 1rem;font-weight:500;cursor:pointer;flex-shrink:0;}

/* ── MUSIC GENRE CHIPS BAR ── */
.ytm-genre-bar{
  display:none;gap:.5rem;overflow-x:auto;padding:.6rem 1rem;background:#141414;
  border-bottom:1px solid rgba(255,255,255,.05);scrollbar-width:none;flex-shrink:0;
}
.ytm-genre-chip{
  background:var(--pill-bg);border:1px solid rgba(255,255,255,.1);border-radius:16px;
  color:#fff;padding:.35rem .8rem;font-size:.78rem;font-weight:500;white-space:nowrap;cursor:pointer;
}
.ytm-genre-chip:active{background:var(--ytmusic-accent);}

/* ── FEED / SCROLL ── */
.yt-feed{flex:1;overflow-y:auto;padding-bottom:70px;}

/* ── YOUTUBE VIDEO CARD ── */
.yt-card{margin-bottom:1.2rem;cursor:pointer;}
.yt-thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#1e1e1e;}
.yt-thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.yt-dur{
  position:absolute;bottom:8px;right:8px;
  background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:500;
  padding:2px 5px;border-radius:4px;
}
.yt-details{display:flex;gap:.8rem;padding:.8rem 1rem 0;}
.yt-avatar{width:36px;height:36px;border-radius:50%;background:#333;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
.yt-meta{flex:1;min-width:0;}
.yt-title{font-size:.92rem;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.yt-subtext{font-size:.78rem;color:var(--muted);margin-top:4px;}

/* ── BOTTOM NAV BAR ── */
.yt-nav{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:#0f0f0f;border-top:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:space-around;z-index:999;
}
.yt-nav-item{
  flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:.7rem;color:var(--muted);cursor:pointer;pointer-events:auto;
}
.yt-nav-item.active{color:#fff;font-weight:700;}
.yt-nav-icon{font-size:1.3rem;}

/* HIDE BOTTOM NAV IN LANDSCAPE */
body.is-landscape .yt-nav { display: none !important; }

/* ── WATCH SCREEN ── */
.yt-watch-screen{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:none;flex-direction:column;width:100%;height:100%;overflow-y:auto;
}
.yt-watch-screen.is-fullscreen .yt-watch-topbar,
.yt-watch-screen.is-fullscreen .yt-watch-info,
.yt-watch-screen.is-fullscreen .yt-nav { display:none!important; }

.yt-watch-topbar{
  height:calc(48px + var(--safe-top));
  padding-top:var(--safe-top);
  padding-left:1rem;padding-right:1rem;
  display:flex;align-items:center;justify-content:space-between;
  background:#121212;border-bottom:1px solid var(--border);flex-shrink:0;
}
.yt-back-btn{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:.2rem .5rem;}

.yt-player-box{width:100%;aspect-ratio:16/9;background:#000;position:sticky;top:0;z-index:10;overflow:hidden;}

/* FULLSCREEN VIDEO MODE */
.yt-watch-screen.is-fullscreen .yt-player-box{
  position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
  z-index:99999!important;aspect-ratio:unset!important;margin:0!important;padding:0!important;
}
#ytPlayerContainer{width:100%;height:100%;border:none;}

.yt-watch-info{padding:1rem;}
.yt-watch-title{font-size:1.05rem;font-weight:700;line-height:1.4;}
.yt-watch-views{font-size:.8rem;color:var(--muted);margin-top:6px;}

.yt-channel-row{display:flex;align-items:center;justify-content:space-between;margin:1rem 0;padding:.5rem 0;}
.yt-chan-left{display:flex;align-items:center;gap:.7rem;}
.yt-sub-btn{background:#fff;color:#000;border:none;border-radius:18px;padding:.45rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;}

/* ── ACTION BUTTONS ROW ── */
.yt-actions-scroll{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none;}
.yt-act-pill{
  background:var(--pill-bg);border:none;border-radius:18px;color:#fff;
  padding:.5rem 1rem;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.4rem;
  white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.yt-act-pill.dl-accent{background:var(--accent);font-weight:700;}
.yt-act-pill.audio-accent{background:#a855f7;font-weight:700;}

/* ── DOWNLOAD MODAL ── */
.dl-modal{
  position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);
  display:none;align-items:flex-end;justify-content:center;
}
.dl-sheet{
  width:100%;background:#212121;border-radius:16px 16px 0 0;
  padding:1.5rem;display:flex;flex-direction:column;gap:1rem;
}
.dl-option{
  background:#333;border:none;border-radius:12px;color:#fff;
  padding:1rem;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
}

/* ── TOAST NOTIFICATION ── */
.toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.18);backdrop-filter:blur(12px);
  color:#fff;padding:.6rem 1.2rem;border-radius:20px;font-size:.85rem;font-weight:600;
  z-index:9999;display:none;pointer-events:none;white-space:nowrap;
}

#bgAudio{display:none;}
</style>
</head>
<body>
<audio id="bgAudio" crossorigin="anonymous" preload="auto"></audio>
<div class="toast" id="toast"></div>

<div class="app" id="appRoot">
  <!-- TOP HEADER -->
  <div class="yt-header">
    <div class="yt-logo" id="headerLogo" onclick="switchTab('home')">
      <div class="yt-logo-icon"></div>
      <span id="headerTitle">YouTube</span>
    </div>
    <div class="yt-hdr-actions">
      <button class="yt-hdr-icon" onclick="focusSearch()">🔍</button>
      <button class="yt-hdr-icon">🔔</button>
    </div>
  </div>

  <!-- SEARCH BAR -->
  <div class="yt-search-bar">
    <div class="yt-input-box">
      <span>🔍</span>
      <input type="text" id="searchInput"
        placeholder="Search YouTube..."
        oninput="toggleClearBtn()"
        onkeydown="handleSearchKey(event)"
        onblur="dismissKeyboard()" />
      <button type="button" class="yt-clear-btn" id="clearBtn"
        onpointerdown="clearSearch(event)"
        onclick="clearSearch(event)">✕</button>
    </div>
    <button class="yt-search-btn" onclick="doSearch()">Search</button>
  </div>

  <!-- YOUTUBE MUSIC GENRE BAR -->
  <div class="ytm-genre-bar" id="ytmGenreBar">
    <div class="ytm-genre-chip" onclick="searchGenre('Trending Songs 2026')">🔥 Trending</div>
    <div class="ytm-genre-chip" onclick="searchGenre('Top Bollywood Music')">🎤 Bollywood Audio</div>
    <div class="ytm-genre-chip" onclick="searchGenre('Romantic Love Songs')">❤️ Romantic</div>
    <div class="ytm-genre-chip" onclick="searchGenre('Punjabi Hits Songs')">💃 Punjabi Beats</div>
    <div class="ytm-genre-chip" onclick="searchGenre('LoFi Chill Beats')">🎧 Lo-Fi Beats</div>
  </div>

  <!-- VIDEO FEED -->
  <div class="yt-feed" id="videoFeed">
    <div style="text-align:center;padding:3rem 1rem;color:#888;">
      Type any song or video name to search
    </div>
  </div>

  <!-- BOTTOM NAV BAR -->
  <div class="yt-nav" id="mainNav">
    <div class="yt-nav-item active" id="navHome" onclick="switchTab('home')">
      <span class="yt-nav-icon">🏠</span>Home
    </div>
    <div class="yt-nav-item" id="navMusic" onclick="switchTab('music')">
      <span class="yt-nav-icon">🎵</span>Music
    </div>
    <div class="yt-nav-item" id="navSubs" onclick="switchTab('subs')">
      <span class="yt-nav-icon">📺</span>Subscriptions
    </div>
    <div class="yt-nav-item" id="navYou" onclick="switchTab('you')">
      <span class="yt-nav-icon">👤</span>You
    </div>
  </div>
</div>

<!-- WATCH SCREEN -->
<div class="yt-watch-screen" id="watchScreen">
  <div class="yt-watch-topbar">
    <button class="yt-back-btn" onclick="handleBackFromWatch()">← Back</button>
    <div style="font-weight:700;font-size:.9rem;" id="nowPlayingText">Now Playing</div>
    <div style="display:flex;gap:.6rem;align-items:center;">
      <button class="yt-back-btn" onclick="toggleFullscreen()" title="Fullscreen" style="font-size:1.3rem;">⛶</button>
    </div>
  </div>

  <div class="yt-player-box" id="playerBox">
    <div id="ytPlayerContainer"></div>
  </div>

  <div class="yt-watch-info">
    <div class="yt-watch-title" id="wTitle">Video Title</div>
    <div class="yt-watch-views" id="wViews">YouTube · Official Stream</div>

    <div class="yt-channel-row">
      <div class="yt-chan-left">
        <div class="yt-avatar" id="wAvatar">Y</div>
        <div>
          <div style="font-weight:600;font-size:.9rem;" id="wChannel">Channel Name</div>
          <div style="font-size:.75rem;color:#aaa;" id="wBadge">YouTube</div>
        </div>
      </div>
      <button class="yt-sub-btn">Subscribe</button>
    </div>

    <div class="yt-actions-scroll">
      <button class="yt-act-pill" id="bgPlayBtn" onclick="toggleBackgroundPlay()">🎧 Background Play</button>
      <button class="yt-act-pill dl-accent" onclick="openDlModal()">⬇️ Download</button>
      <button class="yt-act-pill">👍 Like</button>
      <button class="yt-act-pill">↗️ Share</button>
    </div>
  </div>
</div>

<!-- DOWNLOAD SHEET -->
<div class="dl-modal" id="dlModal" onclick="closeDlModal()">
  <div class="dl-sheet" onclick="event.stopPropagation()">
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:.5rem;">Download Format</div>
    <button class="dl-option" onclick="triggerDownload('mp3')">
      🎵 Audio Only (MP3) <span>⬇</span>
    </button>
    <button class="dl-option" onclick="triggerDownload('mp4')">
      🎬 Video (MP4) <span>⬇</span>
    </button>
    <button style="background:none;border:none;color:#aaa;padding:.5rem;cursor:pointer;font-size:.95rem;" onclick="closeDlModal()">Cancel</button>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API = 'https://aura-music-player-rj2v.onrender.com';
let ytPlayer = null;
let currentVideo = null;
let isBgPlaying = false;
let backPressCount = 0;
let currentMode = 'youtube'; // 'youtube' or 'ytmusic'
let searchAbortController = null;

// ── YOUTUBE PLAYER INIT ──
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytPlayerContainer', {
    height: '100%',
    width: '100%',
    playerVars: {
      autoplay: 1,
      controls: 1,
      rel: 0,
      playsinline: 1,
      enablejsapi: 1,
      fs: 1
    }
  });
}

// ── SEARCH INPUT HANDLING ──
function focusSearch() {
  document.getElementById('searchInput').focus();
}

function toggleClearBtn() {
  const input = document.getElementById('searchInput');
  document.getElementById('clearBtn').style.display = input.value.length > 0 ? 'inline-block' : 'none';
}

function clearSearch(e) {
  if (e) {
    try { e.preventDefault(); e.stopPropagation(); } catch(err){}
  }
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('clearBtn').style.display = 'none';
  input.blur();
  if (document.activeElement) document.activeElement.blur();

  if (searchAbortController) {
    try { searchAbortController.abort(); } catch(err){}
  }

  const feed = document.getElementById('videoFeed');
  feed.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#888;">Type any song or video name to search</div>`;
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    e.target.blur();
    doSearch();
  }
}

function dismissKeyboard() {}

function searchGenre(genreQuery) {
  const si = document.getElementById('searchInput');
  si.value = genreQuery;
  toggleClearBtn();
  doSearch();
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  if (searchAbortController) {
    try { searchAbortController.abort(); } catch(err){}
  }
  searchAbortController = new AbortController();

  const feed = document.getElementById('videoFeed');
  const endpoint = currentMode === 'ytmusic' ? `${API}/api/search/ytmusic` : `${API}/api/search/youtube`;
  const label = currentMode === 'ytmusic' ? '🎵 Searching YouTube Music...' : '🔍 Searching YouTube...';

  feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">${label}</div>`;

  try {
    const timeoutId = setTimeout(() => searchAbortController.abort(), 12000);
    const r = await fetch(`${endpoint}?q=${encodeURIComponent(q)}`, { signal: searchAbortController.signal });
    clearTimeout(timeoutId);
    const data = await r.json();
    renderFeed(data.results || []);
  } catch(e) {
    if (e.name === 'AbortError') {
      feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">Search reset. <br/><br/><button style="background:#333;color:#fff;border:none;padding:.5rem 1rem;border-radius:16px;" onclick="doSearch()">Retry</button></div>`;
    } else {
      feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#f44;">Search failed. Check network.<br/><br/><button style="background:#333;color:#fff;border:none;padding:.5rem 1rem;border-radius:16px;" onclick="doSearch()">Retry</button></div>`;
    }
  }
}

function renderFeed(list) {
  const feed = document.getElementById('videoFeed');
  if (!list.length) {
    feed.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:#aaa;">No results found</div>`;
    return;
  }
  feed.innerHTML = list.map(item => `
    <div class="yt-card" onclick="openWatch('${item.id}','${escHtml(item.title)}','${escHtml(item.artist)}','${item.thumbnail}')">
      <div class="yt-thumb-wrap">
        <img src="${item.thumbnail}" loading="lazy"/>
        <div class="yt-dur">${fmtSec(item.duration)}</div>
      </div>
      <div class="yt-details">
        <div class="yt-avatar">${(item.artist||'Y')[0].toUpperCase()}</div>
        <div class="yt-meta">
          <div class="yt-title">${item.title}</div>
          <div class="yt-subtext">${item.artist||(currentMode === 'ytmusic' ? 'YouTube Music' : 'YouTube')} · ${fmtSec(item.duration)}</div>
        </div>
      </div>
    </div>`).join('');
}

// ── WATCH / PLAYER ──
function openWatch(id, title, artist, thumb) {
  currentVideo = { id, title, artist, thumb };
  document.getElementById('wTitle').textContent = title;
  document.getElementById('wChannel').textContent = artist;
  document.getElementById('wAvatar').textContent = (artist||'Y')[0].toUpperCase();
  document.getElementById('wBadge').textContent = currentMode === 'ytmusic' ? 'YouTube Music' : 'YouTube';
  document.getElementById('nowPlayingText').textContent = currentMode === 'ytmusic' ? '🎵 YouTube Music' : 'Now Playing';

  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  const ws = document.getElementById('watchScreen');
  ws.style.display = 'flex';

  if (ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(id);

  const bgAudio = document.getElementById('bgAudio');
  bgAudio.src = `${API}/api/download?videoId=${encodeURIComponent(id)}&format=mp3`;

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title, artist: artist||'YouTube Music',
      artwork: [{ src: thumb, sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => bgAudio.play());
    navigator.mediaSession.setActionHandler('pause', () => bgAudio.pause());
  }

  checkAutoOrientation();
}

function handleBackFromWatch() {
  const ws = document.getElementById('watchScreen');
  document.getElementById('searchInput').blur();
  if (document.activeElement) document.activeElement.blur();

  if (ws.classList.contains('is-fullscreen')) {
    ws.classList.remove('is-fullscreen');
    document.getElementById('mainNav').style.display = 'flex';
    return;
  }
  closeWatch();
}

function closeWatch() {
  const ws = document.getElementById('watchScreen');
  ws.style.display = 'none';
  ws.classList.remove('is-fullscreen');
  document.body.classList.remove('is-landscape');
  document.getElementById('mainNav').style.display = 'flex';
  if (ytPlayer && ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch(e){} }
  isBgPlaying = false;
  const btn = document.getElementById('bgPlayBtn');
  btn.classList.remove('audio-accent');
  btn.textContent = '🎧 Background Play';
}

function toggleFullscreen() {
  const ws = document.getElementById('watchScreen');
  if (ws.style.display !== 'flex') ws.style.display = 'flex';
  ws.classList.toggle('is-fullscreen');
  document.getElementById('mainNav').style.display = ws.classList.contains('is-fullscreen') ? 'none' : 'flex';
}

// ── BACKGROUND AUDIO PLAY ──
function toggleBackgroundPlay() {
  const bgAudio = document.getElementById('bgAudio');
  const btn = document.getElementById('bgPlayBtn');
  if (!currentVideo) { showToast('Open a video first'); return; }

  if (isBgPlaying) {
    bgAudio.pause();
    isBgPlaying = false;
    btn.classList.remove('audio-accent');
    btn.textContent = '🎧 Background Play';
    showToast('Background play off');
  } else {
    if (ytPlayer && ytPlayer.pauseVideo) { try { ytPlayer.pauseVideo(); } catch(e){} }
    bgAudio.load();
    const p = bgAudio.play();
    if (p) p.catch(() => bgAudio.play());
    isBgPlaying = true;
    btn.classList.add('audio-accent');
    btn.textContent = '⏸ Playing in Background';
    showToast('Playing in background 🎧');
  }
}

// ── DOWNLOAD ──
function openDlModal() {
  if (!currentVideo) { showToast('Open a video first'); return; }
  document.getElementById('dlModal').style.display = 'flex';
}
function closeDlModal() {
  document.getElementById('dlModal').style.display = 'none';
}

function triggerDownload(format) {
  if (!currentVideo) return;
  closeDlModal();
  showToast(`Starting ${format.toUpperCase()} download...`);

  const dlUrl = `${API}/api/download?videoId=${encodeURIComponent(currentVideo.id)}&title=${encodeURIComponent(currentVideo.title)}&format=${format}`;

  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
      window.Capacitor.Plugins.Browser.open({ url: dlUrl });
    } else {
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = `${currentVideo.title}.${format}`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  } catch(e) {
    showToast('Download error: ' + e.message);
  }
}

// ── TOAST ──
function showToast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// ── TAB SWITCHING (YOUTUBE MUSIC INTEGRATION) ──
function switchTab(tab) {
  document.querySelectorAll('.yt-nav-item').forEach(el => el.classList.remove('active'));
  const feed = document.getElementById('videoFeed');
  const si = document.getElementById('searchInput');
  const logo = document.getElementById('headerLogo');
  const title = document.getElementById('headerTitle');
  const genreBar = document.getElementById('ytmGenreBar');

  if (tab === 'home') {
    currentMode = 'youtube';
    logo.classList.remove('ytmusic');
    title.textContent = 'YouTube';
    si.placeholder = 'Search YouTube...';
    genreBar.style.display = 'none';
    document.getElementById('navHome').classList.add('active');
    clearSearch();
  } else if (tab === 'music') {
    currentMode = 'ytmusic';
    logo.classList.add('ytmusic');
    title.textContent = 'YouTube Music';
    si.placeholder = 'Search YouTube Music songs...';
    genreBar.style.display = 'flex';
    document.getElementById('navMusic').classList.add('active');
    si.value = 'jai ho song';
    toggleClearBtn();
    doSearch();
  } else {
    currentMode = 'youtube';
    logo.classList.remove('ytmusic');
    title.textContent = 'YouTube';
    si.placeholder = 'Search YouTube...';
    genreBar.style.display = 'none';
    const queries = { subs:'latest release music videos', you:'top hits songs 2026 playlist' };
    const ids = { subs:'navSubs', you:'navYou' };
    document.getElementById(ids[tab]).classList.add('active');
    si.value = queries[tab] || '';
    toggleClearBtn();
    doSearch();
  }
}

// ── HARDWARE BACK BUTTON ──
function handleHardwareBack() {
  const dlModal = document.getElementById('dlModal');
  const ws = document.getElementById('watchScreen');
  const si = document.getElementById('searchInput');

  document.activeElement && document.activeElement.blur();

  if (dlModal.style.display === 'flex') { closeDlModal(); return true; }
  if (ws.classList.contains('is-fullscreen')) {
    ws.classList.remove('is-fullscreen');
    document.getElementById('mainNav').style.display = 'flex';
    return true;
  }
  if (ws.style.display === 'flex') { closeWatch(); return true; }

  // If search input has text, pressing Back clears search first!
  if (si.value.length > 0) {
    clearSearch();
    return true;
  }

  backPressCount++;
  if (backPressCount === 1) {
    showToast('Press back again to exit');
    setTimeout(() => { backPressCount = 0; }, 2000);
    return true;
  } else if (backPressCount >= 2) {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)
      window.Capacitor.Plugins.App.exitApp();
  }
  return false;
}

// ── ORIENTATION FULLSCREEN ──
function checkAutoOrientation() {
  const ws = document.getElementById('watchScreen');
  const nav = document.getElementById('mainNav');
  const isLandscape = window.innerWidth > window.innerHeight;

  if (isLandscape) {
    document.body.classList.add('is-landscape');
    nav.style.display = 'none';
    if (ws && ws.style.display === 'flex') ws.classList.add('is-fullscreen');
  } else {
    document.body.classList.remove('is-landscape');
    if (ws && !ws.classList.contains('is-fullscreen')) nav.style.display = 'flex';
  }
}

window.addEventListener('resize', checkAutoOrientation);
window.addEventListener('orientationchange', checkAutoOrientation);

// ── PREVENT CHROME REDIRECTS ──
window.open = function() { return null; };
document.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (a && a.href && (a.href.includes('youtube.com') || a.href.includes('youtu.be'))) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, true);

// ── CAPACITOR BACK BUTTON ──
document.addEventListener('DOMContentLoaded', () => {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('backButton', handleHardwareBack);
  }
});

// ── HELPERS ──
function escHtml(str) {
  return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function fmtSec(sec) {
  if (!sec) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
