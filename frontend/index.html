<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Aura Music — Premium Player</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#12121c;--surface:rgba(255,255,255,.06);--border:rgba(255,255,255,.09);
  --text:#f0f0f8;--muted:rgba(255,255,255,.38);--accent:#a855f7;--accent2:#3b82f6;
  --red:#ef4444;--green:#22c55e;--card:rgba(255,255,255,.07);
}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);user-select:none;}

/* ── ANIMATED BG ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 10% 70%,rgba(168,85,247,.2) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 90% 15%,rgba(59,130,246,.18) 0%,transparent 70%),
    radial-gradient(ellipse 40% 50% at 50% 100%,rgba(236,72,153,.12) 0%,transparent 70%);
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{0%{opacity:.7}100%{opacity:1}}

/* ── LAYOUT ── */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}

/* ── HEADER ── */
.header{
  padding:1rem 1.4rem .7rem;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(18,18,28,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.logo{font-size:1.3rem;font-weight:800;background:linear-gradient(130deg,#a855f7,#3b82f6 55%,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr-btns{display:flex;gap:.5rem;}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:.45rem .6rem;font-size:.95rem;cursor:pointer;transition:background .2s;}
.icon-btn:hover{background:rgba(168,85,247,.25);}

/* ── TABS ── */
.tabs{display:flex;padding:.5rem 1.4rem;gap:.4rem;flex-shrink:0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:.35rem .9rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:var(--surface);color:var(--muted);font:.8rem/1 'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all .2s;}
.tab:hover{color:var(--text);background:rgba(168,85,247,.18);}
.tab.on{background:linear-gradient(130deg,#a855f7,#3b82f6);border-color:transparent;color:#fff;}

/* ── SEARCH ── */
.search-row{padding:.65rem 1.4rem;flex-shrink:0;display:flex;gap:.5rem;}
.search-box{
  flex:1;display:flex;align-items:center;gap:.5rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:.5rem 1rem;transition:border-color .2s;
}
.search-box:focus-within{border-color:var(--accent);}
.search-box input{flex:1;background:none;border:none;outline:none;font:inherit;font-size:.9rem;color:var(--text);}
.search-box input::placeholder{color:var(--muted);}
.search-btn{background:linear-gradient(130deg,#a855f7,#3b82f6);border:none;border-radius:10px;color:#fff;padding:.5rem 1rem;font:.85rem/1 'Inter',sans-serif;font-weight:600;cursor:pointer;}

/* ── SOURCE PILLS ── */
.source-pills{display:flex;gap:.4rem;padding:0 1.4rem .5rem;flex-shrink:0;}
.pill{flex-shrink:0;padding:.28rem .75rem;border-radius:999px;font:.75rem/1 'Inter',sans-serif;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--muted);transition:all .15s;}
.pill.on{color:#fff;border-color:transparent;}
.pill.all.on{background:linear-gradient(130deg,#6366f1,#8b5cf6);}
.pill.apple.on{background:linear-gradient(130deg,#fc3c44,#ff6b6b);}
.pill.spotify.on{background:linear-gradient(130deg,#1db954,#17a44b);}
.pill.youtube.on{background:linear-gradient(130deg,#ef4444,#dc2626);}

/* ── SCROLL AREA ── */
.scroll{flex:1;overflow-y:auto;padding:.3rem 1.4rem 0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

/* ── TRACK CARD ── */
.track{
  display:flex;align-items:center;gap:.85rem;
  padding:.75rem;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  margin-bottom:.6rem;cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  position:relative;overflow:hidden;
}
.track::before{content:'';position:absolute;inset:0;opacity:0;background:linear-gradient(120deg,rgba(168,85,247,.12),rgba(59,130,246,.1));transition:opacity .2s;}
.track:hover{transform:translateX(3px);border-color:rgba(168,85,247,.4);box-shadow:0 4px 20px rgba(0,0,0,.35);}
.track:hover::before{opacity:1}
.track.playing{border-color:var(--accent);background:rgba(168,85,247,.1);}
.track-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.08);}
.track-thumb-placeholder{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,rgba(168,85,247,.3),rgba(59,130,246,.3));display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.track-info{flex:1;min-width:0;}
.track-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-size:.75rem;color:var(--muted);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-dur{font-size:.72rem;color:var(--muted);margin-top:.2rem;}
.track-actions{display:flex;flex-direction:column;gap:.3rem;align-items:flex-end;flex-shrink:0;}
.t-btn{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;padding:.2rem .3rem;border-radius:6px;transition:color .15s,background .15s;}
.t-btn:hover{color:var(--text);background:rgba(255,255,255,.08);}
.source-badge{font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:999px;color:#fff;}
.source-badge.apple{background:#fc3c44;}
.source-badge.spotify{background:#1db954;}
.source-badge.youtube{background:#ef4444;}

/* ── LOADING / EMPTY ── */
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:.75rem;color:var(--muted);}
.state-msg .icon{font-size:2.5rem;}
.state-msg .txt{font-size:.9rem;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MINI PLAYER ── */
.mini-player{
  flex-shrink:0;
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem 1.4rem;
  background:rgba(18,18,28,.95);backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  cursor:pointer;transition:background .2s;
  position:relative;overflow:hidden;
}
.mini-player::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(168,85,247,.07),transparent);pointer-events:none;}
.mini-progress{position:absolute;top:0;left:0;height:2px;background:linear-gradient(90deg,#a855f7,#3b82f6);transition:width .5s linear;}
.mini-art{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.08);}
.mini-art-placeholder{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(59,130,246,.4));display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.mini-info{flex:1;min-width:0;}
.mini-title{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:.72rem;color:var(--muted);margin-top:.1rem;}
.mini-btns{display:flex;gap:.3rem;align-items:center;}
.mini-btn{background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;padding:.3rem;border-radius:8px;transition:background .15s;}
.mini-btn:hover{background:rgba(255,255,255,.08);}
.mini-btn.play-pause-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:1rem;}

/* ── FULL PLAYER OVERLAY ── */
.full-player{
  position:fixed;inset:0;z-index:500;
  background:rgba(10,10,18,.97);backdrop-filter:blur(30px);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);
  max-width:480px;margin:0 auto;
}
.full-player.open{transform:translateY(0);}

.fp-handle{display:flex;justify-content:center;padding:.9rem;cursor:pointer;flex-shrink:0;}
.fp-handle-bar{width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;}

.fp-art-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:1rem 2rem;position:relative;
}
.fp-art-glow{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(168,85,247,.25) 0%,transparent 70%);
  filter:blur(20px);
  transition:all .6s;
}
.fp-art{
  width:min(280px,70vw);height:min(280px,70vw);
  border-radius:20px;object-fit:cover;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  position:relative;z-index:1;
  animation:artFloat 4s ease-in-out infinite;
}
@keyframes artFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fp-art-placeholder{
  width:min(280px,70vw);height:min(280px,70vw);
  border-radius:20px;
  background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(59,130,246,.4),rgba(236,72,153,.3));
  display:flex;align-items:center;justify-content:center;font-size:5rem;
  position:relative;z-index:1;animation:artFloat 4s ease-in-out infinite;
}

.fp-body{flex-shrink:0;padding:.5rem 1.6rem 1rem;}

.fp-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;}
.fp-title{font-size:1.15rem;font-weight:700;flex:1;margin-right:1rem;}
.fp-artist{font-size:.85rem;color:var(--muted);margin-top:.2rem;}
.fp-fav{background:none;border:none;font-size:1.5rem;cursor:pointer;transition:transform .2s;}
.fp-fav:hover{transform:scale(1.2);}

/* PROGRESS */
.fp-progress{margin:.3rem 0 .6rem;}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative;touch-action:none;}
.progress-fill{height:100%;background:linear-gradient(90deg,#a855f7,#3b82f6);border-radius:2px;pointer-events:none;transition:width .5s linear;}
.progress-thumb{position:absolute;top:50%;right:-6px;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(168,85,247,.7);pointer-events:none;}
.fp-times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:.35rem;}

/* CONTROLS */
.fp-controls{display:flex;align-items:center;justify-content:space-between;margin:.4rem 0;}
.ctrl-btn{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:.4rem;border-radius:10px;transition:color .15s,background .15s;}
.ctrl-btn:hover{color:var(--text);background:rgba(255,255,255,.07);}
.ctrl-btn.active{color:var(--accent);}
.play-btn{
  width:64px;height:64px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#a855f7,#3b82f6);
  color:#fff;font-size:1.6rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(168,85,247,.5);
  transition:transform .15s,box-shadow .15s;
}
.play-btn:hover{transform:scale(1.06);box-shadow:0 12px 40px rgba(168,85,247,.65);}
.play-btn:active{transform:scale(.95);}

/* VOLUME */
.fp-volume{display:flex;align-items:center;gap:.75rem;margin:.5rem 0;}
.vol-icon{font-size:1rem;color:var(--muted);}
.slider{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);cursor:pointer;outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#3b82f6);cursor:pointer;box-shadow:0 0 8px rgba(168,85,247,.5);}
.vol-pct{font-size:.72rem;color:var(--muted);min-width:36px;text-align:right;}

/* HD TOGGLE */
.fp-extras{display:flex;gap:.6rem;margin-top:.5rem;}
.hd-btn{
  flex:1;padding:.5rem;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:var(--surface);color:var(--muted);font:.78rem/1 'Inter',sans-serif;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.hd-btn.on{background:linear-gradient(130deg,rgba(168,85,247,.3),rgba(59,130,246,.3));border-color:var(--accent);color:#fff;}
.dl-btn{
  flex:1;padding:.5rem;border-radius:10px;
  background:linear-gradient(130deg,rgba(34,197,94,.2),rgba(16,185,129,.2));
  border:1px solid rgba(34,197,94,.3);color:#22c55e;
  font:.78rem/1 'Inter',sans-serif;font-weight:600;cursor:pointer;transition:all .2s;
}
.dl-btn:hover{background:linear-gradient(130deg,rgba(34,197,94,.35),rgba(16,185,129,.35));}

/* VIDEO MODAL */
.video-modal{
  position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.96);
  display:none;flex-direction:column;align-items:center;justify-content:center;
}
.video-modal.open{display:flex;}
.video-wrap{width:100%;max-width:480px;padding:1rem;}
.video-close{display:flex;justify-content:flex-end;margin-bottom:.75rem;}
.video-close button{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:1.2rem;padding:.5rem .9rem;border-radius:10px;cursor:pointer;}
.video-frame{width:100%;aspect-ratio:16/9;border-radius:14px;border:none;background:#000;}

/* DOWNLOAD MODAL */
.dl-modal{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;}
.dl-modal.open{display:flex;}
.dl-sheet{
  width:100%;max-width:480px;background:rgba(18,18,28,.98);
  border-radius:20px 20px 0 0;padding:1.2rem 1.4rem 2rem;
  border-top:1px solid var(--border);
  animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.dl-title{font-size:1rem;font-weight:700;margin-bottom:1rem;text-align:center;}
.dl-options{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem;}
.dl-opt{
  padding:.75rem;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;text-align:center;
  transition:all .2s;
}
.dl-opt:hover{border-color:var(--accent);background:rgba(168,85,247,.12);}
.dl-opt .icon{font-size:1.4rem;}
.dl-opt .label{font-size:.78rem;font-weight:600;margin-top:.3rem;}
.dl-opt .sub{font-size:.68rem;color:var(--muted);}
.dl-cancel{width:100%;padding:.7rem;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="logo">🎵 Aura Music</div>
    <div class="hdr-btns">
      <button class="icon-btn" onclick="toggleQueue()" title="Queue">📋</button>
      <button class="icon-btn" onclick="toggleFavs()" title="Favorites">❤️</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab on" onclick="setTab('search',this)">🔍 Search</button>
    <button class="tab" onclick="setTab('local',this)">📁 Local</button>
    <button class="tab" onclick="setTab('favs',this)">❤️ Favorites</button>
    <button class="tab" onclick="setTab('downloads',this)">⬇️ Downloads</button>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-row" id="searchRow">
    <div class="search-box">
      <span style="opacity:.38;font-size:.85rem">🔍</span>
      <input id="searchInput" type="text" placeholder="Search songs, artists, albums…" onkeydown="if(event.key==='Enter')doSearch()"/>
    </div>
    <button class="search-btn" onclick="doSearch()">Go</button>
  </div>

  <!-- SOURCE PILLS -->
  <div class="source-pills" id="sourcePills">
    <button class="pill all on" onclick="setSource('all',this)">🌐 All</button>
    <button class="pill apple" onclick="setSource('apple',this)">🍎 Apple</button>
    <button class="pill spotify" onclick="setSource('spotify',this)">🟢 Spotify</button>
    <button class="pill youtube" onclick="setSource('youtube',this)">🔴 YouTube</button>
  </div>

  <!-- SCROLL AREA -->
  <div class="scroll" id="mainScroll">
    <div class="state-msg" id="emptyState">
      <div class="icon">🎵</div>
      <div class="txt">Search for your favorite songs</div>
    </div>
    <div id="results"></div>
  </div>

  <!-- MINI PLAYER -->
  <div class="mini-player" id="miniPlayer" style="display:none" onclick="openFullPlayer()">
    <div class="mini-progress" id="miniProgress" style="width:0%"></div>
    <div class="mini-art-placeholder" id="miniArt">🎵</div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-artist" id="miniArtist">—</div>
    </div>
    <div class="mini-btns" onclick="event.stopPropagation()">
      <button class="mini-btn" onclick="prevTrack()">⏮</button>
      <button class="mini-btn play-pause-btn" id="miniPlayBtn" onclick="togglePlay()">▶</button>
      <button class="mini-btn" onclick="nextTrack()">⏭</button>
    </div>
  </div>
</div>

<!-- FULL PLAYER -->
<div class="full-player" id="fullPlayer">
  <div class="fp-handle" onclick="closeFullPlayer()"><div class="fp-handle-bar"></div></div>

  <div class="fp-art-wrap">
    <div class="fp-art-glow" id="fpGlow"></div>
    <div class="fp-art-placeholder" id="fpArt">🎵</div>
  </div>

  <div class="fp-body">
    <div class="fp-info">
      <div>
        <div class="fp-title" id="fpTitle">No track selected</div>
        <div class="fp-artist" id="fpArtist">—</div>
      </div>
      <button class="fp-fav" id="fpFavBtn" onclick="toggleFav()">🤍</button>
    </div>

    <div class="fp-progress">
      <div class="progress-bar" id="progressBar" onmousedown="seekStart(event)" ontouchstart="seekStart(event)">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
        <div class="progress-thumb" id="progressThumb" style="left:0%"></div>
      </div>
      <div class="fp-times">
        <span id="timeNow">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>
    </div>

    <div class="fp-controls">
      <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
      <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
      <button class="play-btn" id="fpPlayBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
      <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
    </div>

    <div class="fp-volume">
      <span class="vol-icon">🔈</span>
      <input class="slider" type="range" min="0" max="500" value="100" id="volSlider" oninput="setVolume(this.value)"/>
      <span class="vol-pct" id="volPct">100%</span>
    </div>

    <div class="fp-extras">
      <button class="hd-btn" id="hdBtn" onclick="toggleHD()">✨ HD Clear: OFF</button>
      <button class="dl-btn" onclick="openDownloadModal()">⬇️ Download</button>
      <button class="hd-btn" id="videoBtn" onclick="openVideo()" style="display:none">▶ Watch</button>
    </div>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
  <div class="video-wrap">
    <div class="video-close"><button onclick="closeVideo()">✕ Close</button></div>
    <iframe id="videoFrame" class="video-frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>
</div>

<!-- DOWNLOAD MODAL -->
<div class="dl-modal" id="dlModal" onclick="closeDlModal()">
  <div class="dl-sheet" onclick="event.stopPropagation()">
    <div class="dl-title">⬇️ Download Track</div>
    <div class="dl-options">
      <div class="dl-opt" onclick="startDownload('mp3')">
        <div class="icon">🎵</div>
        <div class="label">MP3 Audio</div>
        <div class="sub">Best Quality</div>
      </div>
      <div class="dl-opt" onclick="startDownload('mp4','1080')">
        <div class="icon">🎬</div>
        <div class="label">1080p HD</div>
        <div class="sub">Full HD Video</div>
      </div>
      <div class="dl-opt" onclick="startDownload('mp4','720')">
        <div class="icon">📹</div>
        <div class="label">720p HD</div>
        <div class="sub">HD Video</div>
      </div>
      <div class="dl-opt" onclick="startDownload('mp4','480')">
        <div class="icon">📱</div>
        <div class="label">480p SD</div>
        <div class="sub">Compact Size</div>
      </div>
    </div>
    <button class="dl-cancel" onclick="closeDlModal()">Cancel</button>
  </div>
</div>

<audio id="audioEl" crossorigin="anonymous"></audio>

<script>
const API = 'https://aura-music-player-rj2v.onrender.com';

// ── STATE ──
let queue = [], qIdx = -1, shuffle = false, repeat = false;
let hdEnabled = false, gainNode, audioCtx, src, bassF, vocalF, trebleF, limiter;
let currentTrack = null, favorites = JSON.parse(localStorage.getItem('favs')||'[]');
let seeking = false, activeSource = 'all', activeTab = 'search';

const audio = document.getElementById('audioEl');

// ── SEARCH ──
async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  showResults([]);
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('results').innerHTML = `<div class="state-msg"><div class="spinner"></div><div class="txt">Searching…</div></div>`;

  let results = [];
  trackMap = {};
  try {
    const promises = [];
    
    if (activeSource === 'all' || activeSource === 'saavn') {
      promises.push(
        fetch(`${API}/api/search/saavn?q=${encodeURIComponent(q)}`)
          .then(r => r.json())
          .then(r => {
            if (r.results) {
              results = results.concat(r.results);
              queue = results;
              showResults(results);
            }
          })
          .catch(() => {})
      );
    }

    if (activeSource === 'all' || activeSource === 'apple') {
      promises.push(
        fetch(`${API}/api/search/apple?q=${encodeURIComponent(q)}`)
          .then(r => r.json())
          .then(r => {
            if (r.results) {
              results = results.concat(r.results);
              queue = results;
              showResults(results);
            }
          })
          .catch(() => {})
      );
    }
    
    if (activeSource === 'all' || activeSource === 'spotify') {
      promises.push(
        fetch(`${API}/api/search/spotify?q=${encodeURIComponent(q)}`)
          .then(r => r.json())
          .then(r => {
            if (r.results) {
              results = results.concat(r.results);
              queue = results;
              showResults(results);
            }
          })
          .catch(() => {})
      );
    }
    
    if (activeSource === 'all' || activeSource === 'youtube') {
      promises.push(
        fetch(`${API}/api/search/youtube?q=${encodeURIComponent(q)}`)
          .then(r => r.json())
          .then(r => {
            if (r.results) {
              results = results.concat(r.results);
              queue = results;
              showResults(results);
            }
          })
          .catch(() => {})
      );
    }
    
    await Promise.all(promises);
  } catch (e) {}
}

function showResults(results){
  const el = document.getElementById('results');
  if(!results.length){ el.innerHTML=`<div class="state-msg"><div class="icon">📭</div><div class="txt">No results found</div></div>`; return; }
  // Store tracks in map for safe lookup by id
  results.forEach(t => { trackMap[t.id] = t; });
  el.innerHTML = results.map((t,i)=>`
    <div class="track${currentTrack&&currentTrack.id===t.id?' playing':''}" onclick="playById('${t.id}')" id="track_${t.id}">
      ${t.thumbnail
        ? `<img class="track-thumb" src="${t.thumbnail}" onerror="this.style.display='none'"/>`
        : `<div class="track-thumb-placeholder">${t.source==='apple'?'🍎':t.source==='youtube'?'🔴':'🟢'}</div>`
      }
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist||'Unknown'}</div>
        <div class="track-dur">${fmtSec(t.duration)} · <span class="source-badge ${t.source}">${t.source.toUpperCase()}</span></div>
      </div>
      <div class="track-actions">
        <button class="t-btn" onclick="event.stopPropagation();favTrackById('${t.id}', this)" title="Favorite">${favorites.find(f=>f.id===t.id)?'❤️':'🤍'}</button>
        <button class="t-btn" onclick="event.stopPropagation();addToQueueById('${t.id}')" title="Add to queue">➕</button>
      </div>
    </div>
  `).join('');
}

// ── PLAYBACK ──
let trackMap = {};

async function playById(id){
  const t = trackMap[id];
  if(!t){ showToast('Track not found'); return; }
  const idx = queue.findIndex(x=>x.id===id);
  if(idx >= 0) qIdx = idx;
  currentTrack = t;

  updatePlayerUI(t);
  document.getElementById('miniPlayer').style.display='flex';
  document.getElementById('miniPlayBtn').textContent='⏸';
  document.getElementById('fpPlayBtn').textContent='⏸';
  document.getElementById('videoBtn').style.display = t.source==='youtube'?'':'none';

  document.querySelectorAll('.track').forEach(el=>el.classList.remove('playing'));
  const trackEl = document.getElementById(`track_${id}`);
  if(trackEl) trackEl.classList.add('playing');

  const streamUrl = t.directStreamUrl
    ? t.directStreamUrl
    : t.videoId
    ? `${API}/api/stream?videoId=${encodeURIComponent(t.videoId)}`
    : `${API}/api/stream?q=${encodeURIComponent(t.streamQuery||t.title+' '+t.artist+' full official audio')}`;

  // Unlock AudioContext on mobile (must happen inside user gesture)
  if(!audioCtx) initAudio();
  if(audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  // Only reload src if it changed
  if(audio.src !== streamUrl){
    audio.pause();
    audio.src = streamUrl;
    audio.load();
    audio.onerror = () => {
      showToast('Stream error – try another song');
    };
  }

  try {
    await audio.play();
  } catch(err) {
    // On mobile, first tap unlocks audio — second tap plays
    showToast('Tap again to play ▶');
    // Pre-unlock for next tap
    audio.load();
  }
}


async function playTrack(idx){
  if(idx<0||idx>=queue.length) return;
  playById(queue[idx].id);
}

function favTrackById(id, btn){ const idx=queue.findIndex(x=>x.id===id); if(idx>=0) favTrack(idx,btn); }
function addToQueueById(id){ const idx=queue.findIndex(x=>x.id===id); if(idx>=0) addToQueue(idx,null); }

function updatePlayerUI(t){
  document.getElementById('miniTitle').textContent = t.title;
  document.getElementById('miniArtist').textContent = t.artist||'Unknown';
  document.getElementById('fpTitle').textContent = t.title;
  document.getElementById('fpArtist').textContent = t.artist||'Unknown';

  if(t.thumbnail){
    document.getElementById('miniArt').outerHTML = `<img class="mini-art" id="miniArt" src="${t.thumbnail}" onclick="openFullPlayer()"/>`;
    document.getElementById('fpArt').outerHTML = `<img class="fp-art" id="fpArt" src="${t.thumbnail}"/>`;
    document.getElementById('fpGlow').style.background = `radial-gradient(ellipse at center,rgba(168,85,247,.4) 0%,transparent 70%)`;
  } else {
    const icon = t.source==='apple'?'🍎':t.source==='youtube'?'🔴':'🟢';
    document.getElementById('miniArt').innerHTML = icon;
    document.getElementById('fpArt').innerHTML = icon;
  }
  document.getElementById('fpFavBtn').textContent = favorites.find(f=>f.id===t.id)?'❤️':'🤍';
}

audio.ontimeupdate = () => {
  if(seeking||!audio.duration) return;
  const pct = (audio.currentTime/audio.duration)*100;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressThumb').style.left = pct+'%';
  document.getElementById('miniProgress').style.width = pct+'%';
  document.getElementById('timeNow').textContent = fmtSec(audio.currentTime);
  document.getElementById('timeTotal').textContent = fmtSec(audio.duration);
};

audio.onended = () => {
  if(repeat){ audio.currentTime=0; audio.play(); }
  else nextTrack();
};

audio.onplay = () => {
  document.getElementById('fpPlayBtn').textContent='⏸';
  document.getElementById('miniPlayBtn').textContent='⏸';
};
audio.onpause = () => {
  document.getElementById('fpPlayBtn').textContent='▶';
  document.getElementById('miniPlayBtn').textContent='▶';
};

function togglePlay(){ audio.paused ? audio.play() : audio.pause(); }
function prevTrack(){ playTrack(shuffle ? rndIdx() : Math.max(0,qIdx-1)); }
function nextTrack(){ playTrack(shuffle ? rndIdx() : (qIdx+1)%Math.max(1,queue.length)); }
function rndIdx(){ return Math.floor(Math.random()*queue.length); }

function showToast(msg){
  let t = document.getElementById('toastMsg');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastMsg';
    t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999;transition:opacity .5s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 3000);
}

// ── SEEKING (HTTP 206) ──
function seekStart(e){
  seeking = true;
  const move = ev => updateSeek(ev.touches?ev.touches[0]:ev);
  const up = ev => {
    seeking = false;
    const pct = getSeekPct(ev.changedTouches?ev.changedTouches[0]:ev);
    if(audio.duration) audio.currentTime = audio.duration * pct;
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move);
    document.removeEventListener('touchend',up);
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',move,{passive:true});
  document.addEventListener('touchend',up);
  updateSeek(e.touches?e.touches[0]:e);
}
function getSeekPct(e){
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  return Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
}
function updateSeek(e){
  const pct = getSeekPct(e)*100;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressThumb').style.left = pct+'%';
}

// ── VOLUME (0–500%) ──
function setVolume(v){
  const pct = parseInt(v);
  document.getElementById('volPct').textContent = pct+'%';
  if(audioCtx && gainNode) gainNode.gain.setTargetAtTime(pct/100, audioCtx.currentTime, 0.01);
  else audio.volume = Math.min(1, pct/100);
}

// ── STUDIO HD DSP ──
function initAudio(){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  src = audioCtx.createMediaElementSource(audio);
  bassF = audioCtx.createBiquadFilter(); bassF.type='lowshelf'; bassF.frequency.value=90;
  vocalF = audioCtx.createBiquadFilter(); vocalF.type='peaking'; vocalF.frequency.value=2500; vocalF.Q.value=1;
  trebleF = audioCtx.createBiquadFilter(); trebleF.type='highshelf'; trebleF.frequency.value=10000;
  limiter = audioCtx.createDynamicsCompressor();
  limiter.threshold.value=-12; limiter.knee.value=10; limiter.ratio.value=5;
  limiter.attack.value=0.003; limiter.release.value=0.1;
  gainNode = audioCtx.createGain(); gainNode.gain.value=1;
  src.connect(gainNode); gainNode.connect(bassF); bassF.connect(vocalF); vocalF.connect(trebleF); trebleF.connect(limiter); limiter.connect(audioCtx.destination);
  applyHD();
}
function applyHD(){
  if(!bassF) return;
  if(hdEnabled){
    bassF.gain.setTargetAtTime(4.5,audioCtx.currentTime,0.01);
    vocalF.gain.setTargetAtTime(4.0,audioCtx.currentTime,0.01);
    trebleF.gain.setTargetAtTime(5.5,audioCtx.currentTime,0.01);
  } else {
    bassF.gain.setTargetAtTime(0,audioCtx.currentTime,0.01);
    vocalF.gain.setTargetAtTime(0,audioCtx.currentTime,0.01);
    trebleF.gain.setTargetAtTime(0,audioCtx.currentTime,0.01);
  }
}
function toggleHD(){
  hdEnabled=!hdEnabled;
  document.getElementById('hdBtn').textContent=`✨ HD Clear: ${hdEnabled?'ON':'OFF'}`;
  document.getElementById('hdBtn').classList.toggle('on',hdEnabled);
  applyHD();
}

// ── SHUFFLE / REPEAT ──
function toggleShuffle(){ shuffle=!shuffle; document.getElementById('shuffleBtn').classList.toggle('active',shuffle); }
function toggleRepeat(){ repeat=!repeat; document.getElementById('repeatBtn').classList.toggle('active',repeat); }

// ── FAVORITES ──
function favTrack(idx, btn){
  const t = queue[idx];
  const i = favorites.findIndex(f=>f.id===t.id);
  if(i>=0) favorites.splice(i,1); else favorites.push(t);
  localStorage.setItem('favs',JSON.stringify(favorites));
  if(btn) btn.textContent = (i>=0) ? '🤍' : '❤️';
  if(activeTab === 'favs') showResults(favorites);
  if(currentTrack&&currentTrack.id===t.id) document.getElementById('fpFavBtn').textContent=favorites.find(f=>f.id===t.id)?'❤️':'🤍';
}
function toggleFav(){
  if(!currentTrack) return;
  const i = favorites.findIndex(f=>f.id===currentTrack.id);
  if(i>=0) favorites.splice(i,1); else favorites.push(currentTrack);
  localStorage.setItem('favs',JSON.stringify(favorites));
  document.getElementById('fpFavBtn').textContent=favorites.find(f=>f.id===currentTrack.id)?'❤️':'🤍';
}
function addToQueue(idx, btn){ 
  if(!queue.includes(queue[idx])) queue.push(queue[idx]); 
  if(btn) {
    btn.textContent = '✅';
    setTimeout(() => { if(btn) btn.textContent = '➕'; }, 1000);
  }
}

// ── FULL PLAYER ──
function openFullPlayer(){ document.getElementById('fullPlayer').classList.add('open'); }
function closeFullPlayer(){ document.getElementById('fullPlayer').classList.remove('open'); }

// ── VIDEO ──
function openVideo(){
  if(!currentTrack||!currentTrack.videoId) return;
  document.getElementById('videoFrame').src=`https://www.youtube-nocookie.com/embed/${currentTrack.videoId}?autoplay=1&cc_load_policy=1`;
  document.getElementById('videoModal').classList.add('open');
}
function closeVideo(){ document.getElementById('videoModal').classList.remove('open'); document.getElementById('videoFrame').src=''; }

// ── DOWNLOAD ──
function openDownloadModal(){ document.getElementById('dlModal').classList.add('open'); }
function closeDlModal(){ document.getElementById('dlModal').classList.remove('open'); }
function startDownload(format, quality=''){
  if(!currentTrack) return;
  closeDlModal();
  const baseParams = `format=${format}${quality?'&quality='+quality:''}&title=${encodeURIComponent(currentTrack.title + (currentTrack.artist ? ' - ' + currentTrack.artist : ''))}`;
  const params = currentTrack.videoId
    ? `videoId=${encodeURIComponent(currentTrack.videoId)}&${baseParams}`
    : `q=${encodeURIComponent((currentTrack.streamQuery||currentTrack.title+' '+currentTrack.artist))}&${baseParams}`;
  const dlUrl = `${API}/api/download?${params}`;
  
  if (window.Capacitor && window.Capacitor.isNativePlatform()) {
    // Use Capacitor Browser to trigger native download handling
    if (window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
        window.Capacitor.Plugins.Browser.open({ url: dlUrl });
    } else {
        window.open(dlUrl, '_system');
    }
  } else {
    // Fallback for web
    const a = document.createElement('a');
    a.href = dlUrl;
    a.download = `${currentTrack.title}.${format==='mp4'?'mp4':'mp3'}`;
    a.click();
  }
}

// ── TABS & FILTERS ──
function setTab(name, btn){
  activeTab = name;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const sr = document.getElementById('searchRow');
  const sp = document.getElementById('sourcePills');
  sr.style.display = name==='search'?'flex':'none';
  sp.style.display = name==='search'?'flex':'none';
  if(name==='favs'){ queue=favorites; showResults(favorites); }
  else if(name==='search'){ showResults([]); document.getElementById('emptyState').style.display='flex'; }
}
function setSource(s, btn){
  activeSource = s;
  document.querySelectorAll('.pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(document.getElementById('searchInput').value.trim()) doSearch();
}
function toggleQueue(){ alert('Queue: '+queue.map((t,i)=>`${i===qIdx?'▶ ':''}${t.title}`).join('\n')); }
function toggleFavs(){ setTab('favs',document.querySelectorAll('.tab')[2]); }

// ── UTILS ──
function fmtSec(s){ s=Math.floor(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
// ── CAPACITOR ANDROID BACK BUTTON ──
document.addEventListener('DOMContentLoaded', () => {
  if (window.Capacitor && window.Capacitor.Plugins) {
    const { App, Toast } = window.Capacitor.Plugins;
    if (App) {
      let lastBackPress = 0;
      App.addListener('backButton', () => {
        // Close modals first if open
        if (document.getElementById('dlModal').classList.contains('open')) { closeDlModal(); return; }
        if (document.getElementById('videoModal').classList.contains('open')) { closeVideo(); return; }
        if (document.getElementById('fullPlayer').classList.contains('open')) { closeFullPlayer(); return; }
        
        // Double press to exit
        const timeNow = Date.now();
        if (timeNow - lastBackPress < 2000) {
          App.exitApp();
        } else {
          lastBackPress = timeNow;
          if(Toast) Toast.show({ text: 'Press back again to exit' });
        }
      });
    }
  }
});
</script>
